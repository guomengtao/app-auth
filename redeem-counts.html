<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>兑换码数量</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #f5f5f5;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }
  .card {
    background: #fff;
    border-radius: 12px;
    padding: 40px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    text-align: center;
    min-width: 300px;
  }
  h1 {
    font-size: 18px;
    color: #666;
    margin-bottom: 24px;
    font-weight: 500;
  }
  .counts {
    display: flex;
    gap: 40px;
    justify-content: center;
  }
  .count-item {
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .count-label {
    font-size: 14px;
    color: #999;
    margin-bottom: 8px;
  }
  .count-value {
    font-size: 48px;
    font-weight: 700;
    color: #333;
    line-height: 1;
  }
  .count-value.pending {
    font-size: 24px;
    color: #ccc;
  }
  .divider {
    width: 1px;
    background: #eee;
  }
  .error {
    color: #ef4444;
    font-size: 14px;
    margin-top: 16px;
  }
</style>
</head>
<body>
<div class="card">
  <h1>兑换码数量</h1>
  <div class="counts">
    <div class="count-item">
      <span class="count-label">本地</span>
      <span class="count-value" id="localCount">-</span>
    </div>
    <div class="divider"></div>
    <div class="count-item">
      <span class="count-label">线上</span>
      <span class="count-value pending" id="remoteCount">...</span>
    </div>
  </div>
  <div class="error" id="error" style="display:none;"></div>
</div>

<script>
var STORAGE_KEY_CODES = 'admin_redeem_codes';

function getLocalCount() {
  try {
    var raw = localStorage.getItem(STORAGE_KEY_CODES);
    if (!raw) return 0;
    var arr = JSON.parse(raw);
    return Array.isArray(arr) ? arr.length : 0;
  } catch (e) {
    return 0;
  }
}

function showLocalCount() {
  var count = getLocalCount();
  document.getElementById('localCount').textContent = count;
}

async function loadRemoteCount() {
  var el = document.getElementById('remoteCount');
  var errEl = document.getElementById('error');
  try {
    var res = await fetch('/api/admin/redeem-codes?limit=1');
    if (res.status === 401) {
      el.textContent = '-';
      el.className = 'count-value';
      return;
    }
    var data = await res.json();
    if (data && data.success) {
      el.textContent = data.total;
      el.className = 'count-value';
    } else {
      throw new Error(data.error || 'unknown');
    }
  } catch (e) {
    el.textContent = '?';
    el.className = 'count-value';
    errEl.textContent = '获取线上数据失败: ' + (e.message || '');
    errEl.style.display = 'block';
  }
}

showLocalCount();
loadRemoteCount();
</script>
</body>
</html>
