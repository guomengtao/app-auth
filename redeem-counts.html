<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>兑换码数量</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #f5f5f5;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }
  .card {
    background: #fff;
    border-radius: 12px;
    padding: 40px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    text-align: center;
    min-width: 300px;
  }
  h1 {
    font-size: 18px;
    color: #666;
    margin-bottom: 24px;
    font-weight: 500;
  }
  .counts {
    display: flex;
    gap: 40px;
    justify-content: center;
  }
  .count-item {
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .count-label {
    font-size: 14px;
    color: #6b7280;
    margin-bottom: 8px;
  }
  .count-value {
    font-size: 48px;
    font-weight: 700;
    color: #333;
    line-height: 1.2;
  }
  .count-value.pending {
    font-size: 24px;
    color: #ccc;
  }
  .divider {
    width: 1px;
    background: #eee;
  }
  .error {
    color: #ef4444;
    font-size: 14px;
    margin-top: 16px;
  }
</style>
</head>
<body>
<div id="evSiteNavWrap"><div class="filterbar" id="siteNav"></div></div><style>#evSiteNavWrap{max-width:1100px;margin:0 auto;padding:14px 20px 0}#siteNav{display:flex;flex-wrap:wrap;gap:8px;align-items:center}#siteNav .fbtn{border:1px solid #d5dae1;background:#fff;color:#22303c;padding:6px 14px;border-radius:20px;font-size:.82rem;text-decoration:none;cursor:pointer;font-weight:600}#siteNav .fbtn.active{background:#0b6bcb;border-color:#0b6bcb;color:#fff;font-weight:700}</style><script src="/js/site-nav.js"></script>
<script>if(window.SiteNav)SiteNav.mountNav('siteNav','redeem-counts');</script>

<div class="card">
  <h1>兑换码数量</h1>
  <div class="counts">
    <div class="count-item">
      <span class="count-label">本地</span>
      <span class="count-value" id="localCount">-</span>
    </div>
    <div class="divider"></div>
    <div class="count-item">
      <span class="count-label">线上</span>
      <span class="count-value pending" id="remoteCount">...</span>
    </div>
  </div>
  <div class="error" id="error" style="display:none;"></div>
</div>

<script>
function xhrFetch(url, options) {
  options = options || {};
  var result = {};
  var callbacks = [];
  var errCallbacks = [];
  result.then = function(cb) { callbacks.push(cb); return result; };
  result.catch = function(cb) { errCallbacks.push(cb); return result; };
  var xhr = new XMLHttpRequest();
  xhr.open(options.method || 'GET', url, true);
  if (options.headers) {
    for (var k in options.headers) {
      if (options.headers.hasOwnProperty(k)) {
        xhr.setRequestHeader(k, options.headers[k]);
      }
    }
  }
  xhr.onload = function() {
    for (var i = 0; i < callbacks.length; i++) {
      callbacks[i]({
        status: xhr.status,
        ok: xhr.status >= 200 && xhr.status < 300,
        json: function() { var d = JSON.parse(xhr.responseText); return { then: function(cb) { cb(d); } }; },
        text: function() { var t = xhr.responseText; return { then: function(cb) { cb(t); } }; }
      });
    }
  };
  xhr.onerror = function() {
    for (var i = 0; i < errCallbacks.length; i++) { errCallbacks[i](new Error('Network error')); }
  };
  xhr.send(options.body || null);
  return result;
}

var STORAGE_KEY_CODES = 'admin_redeem_codes';

function getLocalCount() {
  try {
    var raw = localStorage.getItem(STORAGE_KEY_CODES);
    if (!raw) return 0;
    var arr = JSON.parse(raw);
    return Array.isArray(arr) ? arr.length : 0;
  } catch (e) {
    return 0;
  }
}

function showLocalCount() {
  var count = getLocalCount();
  document.getElementById('localCount').textContent = count;
}

function loadRemoteCount() {
  var el = document.getElementById('remoteCount');
  var errEl = document.getElementById('error');
  xhrFetch('/api/admin/redeem-codes?limit=1').then(function(res) {
    if (res.status === 401) {
      el.textContent = '-';
      el.className = 'count-value';
      return null;
    }
    return res.json().then(function(data) {
      if (data && data.success) {
        el.textContent = data.total;
        el.className = 'count-value';
      } else {
        throw new Error(data.error || 'unknown');
      }
    });
  }).catch(function(e) {
    el.textContent = '?';
    el.className = 'count-value';
    errEl.textContent = '获取线上数据失败: ' + (e.message || '');
    errEl.style.display = 'block';
  });
}

showLocalCount();
loadRemoteCount();
</script>
<script>
(function(){
  try {
    var r = new XMLHttpRequest();
    r.open('POST', '/api/admin/health?section=visit', true);
    r.setRequestHeader('Content-Type', 'application/json');
    r.send(JSON.stringify({page:location.pathname,referrer:document.referrer||'',title:document.title||''}));
  } catch(_) {}
})();
</script>

</body>
</html>
