<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>激活码系统 - 设备激活</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: rgba(255,255,255,0.97);
      border-radius: 24px;
      padding: 40px 36px;
      max-width: 460px;
      width: 100%;
      box-shadow: 0 30px 80px rgba(0,0,0,0.5);
      animation: slideUp 0.5s ease-out;
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .icon { text-align: center; font-size: 48px; margin-bottom: 12px; }
    h1 { text-align: center; font-size: 1.5rem; color: #1a1a2e; margin-bottom: 4px; }
    .subtitle { text-align: center; font-size: 0.82rem; color: #6b7280; margin-bottom: 28px; }

    .steps {
      background: #f8f9ff;
      border-radius: 12px;
      padding: 16px 18px;
      margin-bottom: 24px;
      border-left: 3px solid #6c63ff;
    }
    .steps-title {
      font-size: 0.8rem;
      font-weight: 700;
      color: #6c63ff;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .steps ol {
      padding-left: 18px;
      font-size: 0.78rem;
      color: #555;
      line-height: 1.8;
    }
    .steps ol li { margin-bottom: 2px; }

    .field { margin-bottom: 18px; }
    .field label {
      display: block;
      font-size: 0.78rem;
      font-weight: 600;
      color: #555;
      margin-bottom: 5px;
    }
    .field input {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid #e8e8e8;
      border-radius: 12px;
      font-size: 1rem;
      font-family: 'SF Mono', 'Fira Code', 'Menlo', monospace;
      letter-spacing: 2px;
      transition: border-color 0.2s;
      outline: none;
      text-align: center;
    }
    .field input:focus { border-color: #6c63ff; }
    .field input::placeholder {
      letter-spacing: 0;
      font-family: inherit;
      font-size: 0.82rem;
      color: #bbb;
    }
    .field input.readonly {
      background: #f5f5f5;
      color: #888;
      cursor: default;
      letter-spacing: 0;
      font-family: inherit;
      font-size: 0.82rem;
    }

    .btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #6c63ff, #e94560);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      margin-top: 4px;
      letter-spacing: 1px;
    }
    .btn:hover { opacity: 0.92; }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .result {
      margin-top: 20px;
      padding: 16px;
      border-radius: 12px;
      text-align: center;
      display: none;
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .result.show { display: block; }
    .result.success { background: #e8f5e9; color: #2e7d32; border: 1px solid #a5d6a7; }
    .result.error { background: #ffebee; color: #c62828; border: 1px solid #ef9a9a; }
    .result .code {
      font-family: 'SF Mono', 'Fira Code', 'Menlo', monospace;
      font-size: 1.6rem;
      font-weight: 700;
      margin: 12px 0;
      letter-spacing: 6px;
      line-height: 1.8;
    }
    .copy-btn {
      margin-top: 8px;
      padding: 8px 20px;
      font-size: 0.8rem;
      background: #2e7d32;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }
    .copy-btn:hover { opacity: 0.85; }
    .loading {
      display: inline-block;
      width: 16px; height: 16px;
      border: 2px solid #fff;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .device-info {
      text-align: center;
      font-size: 0.75rem;
      color: #6b7280;
      margin-top: 14px;
    }
    .version-footer {
      text-align: center;
      font-size: 0.7rem;
      color: #9ca3af;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#6c63ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></div>
    <h1>设备激活</h1>
    <p class="subtitle">输入兑换码获取激活码</p>

    <div class="steps">
      <div class="steps-title">激活步骤</div>
      <ol>
        <li>确认下方设备ID与您的设备一致</li>
        <li>输入您的 <strong>4位兑换码</strong></li>
        <li>点击激活获取 <strong>18位激活码</strong></li>
        <li>将激活码输入到手环/手表应用中</li>
      </ol>
    </div>

    <div class="field">
      <label>设备ID</label>
      <input type="text" id="deviceId" class="readonly" readonly>
    </div>
    <div class="field">
      <label>兑换码</label>
      <input type="text" id="redeemCode" placeholder="输入4位兑换码" maxlength="4" autocomplete="off">
    </div>
    <button class="btn" id="activateBtn" onclick="activate()">立即激活</button>

    <div class="result" id="result"></div>
    <div class="device-info" id="deviceInfo"></div>
    <div class="version-footer" id="version-text"></div>
  </div>

  <script>
    function parseQueryParams(qs) {
      var params = {};
      if (qs && qs.charAt(0) === '?') qs = qs.substring(1);
      if (qs) {
        var pairs = qs.split('&');
        for (var i = 0; i < pairs.length; i++) {
          var eqIdx = pairs[i].indexOf('=');
          if (eqIdx >= 0) {
            params[decodeURIComponent(pairs[i].substring(0, eqIdx))] = decodeURIComponent(pairs[i].substring(eqIdx + 1));
          }
        }
      }
      return params;
    }

    function xhrFetch(url, options) {
      options = options || {};
      var result = {};
      var callbacks = [];
      var errorCallbacks = [];
      result.then = function(cb) { callbacks.push(cb); return result; };
      result.catch = function(cb) { errorCallbacks.push(cb); return result; };
      var xhr = new XMLHttpRequest();
      xhr.open(options.method || 'GET', url, true);
      if (options.headers) {
        for (var k in options.headers) {
          if (options.headers.hasOwnProperty(k)) {
            xhr.setRequestHeader(k, options.headers[k]);
          }
        }
      }
      xhr.onload = function() {
        var _text = xhr.responseText;
        var res = {
          status: xhr.status,
          ok: xhr.status >= 200 && xhr.status < 300,
          _text: _text,
          json: function() {
            return {
              then: function(cb) {
                var parsed = null;
                try { parsed = JSON.parse(_text); } catch (_) { parsed = null; }
                cb(parsed);
              }
            };
          },
          text: function() { return { then: function(cb) { cb(_text); } }; }
        };
        try {
          for (var i = 0; i < callbacks.length; i++) { callbacks[i](res); }
        } catch (e) {
          for (var j = 0; j < errorCallbacks.length; j++) { errorCallbacks[j](e); }
        }
        if (typeof setLoading === 'function') setLoading(false);
      };
      xhr.onerror = function() {
        if (typeof setLoading === 'function') setLoading(false);
      };
      xhr.send(options.body || null);
      return result;
    }

    function getDeviceIdFromUrl() {
      var params = parseQueryParams(window.location.search);
      return params['deviceId'] || params['deviceid'] || params['id'] || '';
    }

    function getDeviceInfoFromUrl() {
      var params = parseQueryParams(window.location.search);
      return {
        model: params['m'] || '',
        product: params['p'] || '',
        osVersionCode: params['o'] || '',
        platformVersionCode: params['v'] || '',
        deviceType: params['t'] || '',
        screenShape: params['s'] || '',
        screenWidth: params['w'] || '',
        screenHeight: params['h'] || '',
        apiLevel: params['a'] || '',
        language: params['l'] || navigator.language || '',
        romVersion: params['r'] || '',
      };
    }

    function populateDevicePanel(info) {
      var hasInfo = info.model || info.product || info.deviceType;
      if (!hasInfo) return;
      document.getElementById('devicePanel').style.display = 'block';
      if (info.model) document.getElementById('dModel').textContent = info.model;
      if (info.product) document.getElementById('dProduct').textContent = info.product;
      if (info.osVersionCode) document.getElementById('dOsVer').textContent = info.osVersionCode;
      if (info.platformVersionCode) document.getElementById('dPlatVer').textContent = info.platformVersionCode;
      if (info.deviceType) document.getElementById('dType').textContent = info.deviceType;
      if (info.screenShape) {
        var screenText = info.screenShape;
        if (info.screenWidth && info.screenHeight) screenText += ' (' + info.screenWidth + 'x' + info.screenHeight + ')';
        document.getElementById('dScreen').textContent = screenText;
      }
      if (info.apiLevel) document.getElementById('dApiLevel').textContent = info.apiLevel;
      if (info.language) document.getElementById('dLang').textContent = info.language;
    }

    var deviceInfo = getDeviceInfoFromUrl();

    var deviceId = getDeviceIdFromUrl();
    if (!deviceId) {
      deviceId = localStorage.getItem('deviceId') || '';
    }
    if (!deviceId) {
      var chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
      deviceId = '';
      for (var i = 0; i < 4; i++) {
        deviceId += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      localStorage.setItem('deviceId', deviceId);
    }

    document.getElementById('deviceId').value = deviceId;
    document.getElementById('deviceInfo').textContent = '设备ID来源: ' + (getDeviceIdFromUrl() ? 'URL参数' : '本地生成');

    function setLoading(loading) {
      var btn = document.getElementById('activateBtn');
      if (loading) {
        btn.disabled = true;
        btn.innerHTML = '<span class="loading"></span>激活中...';
      } else {
        btn.disabled = false;
        btn.innerHTML = '立即激活';
      }
    }

    function fmtCode(code) {
      if (!code) return code;
      if (code.length === 18) {
        return code.substring(0, 6) + '<br>' + code.substring(6, 12) + '<br>' + code.substring(12, 18);
      }
      if (code.length === 16) {
        return code.substring(0, 4) + '<br>' + code.substring(4, 8) + '<br>' + code.substring(8, 12) + '<br>' + code.substring(12, 16);
      }
      return code;
    }

    function showResult(type, message, code) {
      var el = document.getElementById('result');
      el.className = 'result show ' + (type === 'success' ? 'success' : 'error');
      var html = '<strong>' + (type === 'success' ? '激活成功！' : '激活失败') + '</strong>';
      html += '<p style="margin-top:4px;font-size:0.85rem">' + message + '</p>';
      if (code) {
        var displayCode = fmtCode(code);
        html += '<div class="code">' + displayCode + '</div>';
        html += '<button class="copy-btn" onclick="copyCode(\'' + code + '\')">复制激活码</button>';
      }
      el.innerHTML = html;
    }

    function copyCode(code) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(code).then(function() {
          var btn = document.querySelector('.copy-btn');
          if (btn) { btn.textContent = '已复制！'; btn.style.background = '#666'; }
        }).catch(function() {
          fallbackCopy(code);
        });
      } else {
        fallbackCopy(code);
      }
    }
    function fallbackCopy(text) {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.left = '-9999px';
      ta.style.top = '-9999px';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      try {
        document.execCommand('copy');
        var btn = document.querySelector('.copy-btn');
        if (btn) { btn.textContent = '已复制！'; btn.style.background = '#666'; }
      } catch (_) {}
      document.body.removeChild(ta);
    }

    function activate() {
      var codeInput = document.getElementById('redeemCode');
      var code = codeInput.value.trim();

      if (!code) {
        showResult('error', '请输入兑换码');
        return;
      }

      if (code.length !== 4) {
        showResult('error', '兑换码必须为4位');
        return;
      }

      setLoading(true);
      document.getElementById('result').className = 'result';

      var hasDeviceInfo = deviceInfo.model || deviceInfo.product || deviceInfo.deviceType;
      xhrFetch('/api/activate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          deviceId: deviceId,
          redeemCode: code,
          deviceInfo: hasDeviceInfo ? deviceInfo : null
        })
      }).then(function(res) {
        var httpStatus = res.status;
        return res.json().then(function(data) {
          console.group('📧 激活请求详情');
          console.log('HTTP Status:', httpStatus);
          console.log('Device ID:', deviceId);
          console.log('Redeem Code:', code);
          console.log('Response:', data);

          if (data.debug) {
            console.log('---');
            var emailStatus = data.debug.notification === 'sent' ? '✅ 邮件已发送' : '❌ 邮件发送失败';
            var actionLabel = data.success ? '激活成功' : '激活失败';
            console.log('📬 邮件通知 (' + actionLabel + '):', emailStatus);
            console.log('📋 原因:', data.debug.reason || 'N/A');
            if (data.debug.productId) console.log('📦 产品:', data.debug.productId);
            if (data.debug.months) console.log('📅 时长:', data.debug.months + '个月');

            if (data.debug.visitor) {
              var v = data.debug.visitor;
              console.log('👤 访客:', [v.ip, v.os, v.browser, v.device].filter(Boolean).join(' | '));
            }
          }
          console.groupEnd();

          if (data.success) {
            showResult('success', '请将激活码输入到手环应用中', data.activationCode);
            codeInput.value = '';
          } else {
            showResult('error', data.error || '激活失败，请重试');
          }
        });
      }).catch(function(e) {
        console.error('❌ 网络错误:', e.message);
        showResult('error', '网络错误，请检查网络后重试');
      }).then(function() {
        setLoading(false);
      });
    }

    document.getElementById('redeemCode').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') activate();
    });

    (function(){
      try {
        xhrFetch('/api/activate?section=visitor-track', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ path: window.location.pathname + window.location.search })
        }).catch(function(){});
      } catch(e){}
    })();

    (function(){
      xhrFetch('/api/version')
        .then(function(res) { return res.json(); })
        .then(function(v) {
          var el = document.getElementById('version-text');
          if (el && v.version) {
            el.textContent = 'v' + v.version;
          }
        })
        .catch(function() {});
    })();
  </script>
<script>
(function(){
  try {
    var r = new XMLHttpRequest();
    r.open('POST', '/api/admin/health?section=visit', true);
    r.setRequestHeader('Content-Type', 'application/json');
    r.send(JSON.stringify({page:location.pathname,referrer:document.referrer||'',title:document.title||''}));
  } catch(_) {}
})();
</script>
</body>
</html>
