<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>激活码系统 - 设备激活</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: rgba(255,255,255,0.97);
      border-radius: 24px;
      padding: 40px 36px;
      max-width: 460px;
      width: 100%;
      box-shadow: 0 30px 80px rgba(0,0,0,0.5);
      animation: slideUp 0.5s ease-out;
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .icon { text-align: center; font-size: 48px; margin-bottom: 12px; }
    h1 { text-align: center; font-size: 1.5rem; color: #1a1a2e; margin-bottom: 4px; }
    .subtitle { text-align: center; font-size: 0.82rem; color: #6b7280; margin-bottom: 28px; }

    .steps {
      background: #f8f9ff;
      border-radius: 12px;
      padding: 16px 18px;
      margin-bottom: 24px;
      border-left: 3px solid #6c63ff;
    }
    .steps-title {
      font-size: 0.8rem;
      font-weight: 700;
      color: #6c63ff;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .steps ol {
      padding-left: 18px;
      font-size: 0.78rem;
      color: #555;
      line-height: 1.8;
    }
    .steps ol li { margin-bottom: 2px; }

    .field { margin-bottom: 18px; }
    .field label {
      display: block;
      font-size: 0.78rem;
      font-weight: 600;
      color: #555;
      margin-bottom: 5px;
    }
    .field input {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid #e8e8e8;
      border-radius: 12px;
      font-size: 1rem;
      font-family: 'SF Mono', 'Fira Code', 'Menlo', monospace;
      letter-spacing: 2px;
      transition: border-color 0.2s;
      outline: none;
      text-align: center;
    }
    .field input:focus { border-color: #6c63ff; }
    .field input::placeholder {
      letter-spacing: 0;
      font-family: inherit;
      font-size: 0.82rem;
      color: #bbb;
    }
    .field input.readonly {
      background: #f5f5f5;
      color: #888;
      cursor: default;
      letter-spacing: 0;
      font-family: inherit;
      font-size: 0.82rem;
    }

    .btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #6c63ff, #e94560);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      margin-top: 4px;
      letter-spacing: 1px;
    }
    .btn:hover { opacity: 0.92; }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .result {
      margin-top: 20px;
      padding: 16px;
      border-radius: 12px;
      text-align: center;
      display: none;
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .result.show { display: block; }
    .result.success { background: #e8f5e9; color: #2e7d32; border: 1px solid #a5d6a7; }
    .result.error { background: #ffebee; color: #c62828; border: 1px solid #ef9a9a; }
    .result .code {
      font-family: 'SF Mono', 'Fira Code', 'Menlo', monospace;
      font-size: 1.6rem;
      font-weight: 700;
      margin: 12px 0;
      letter-spacing: 6px;
      line-height: 1.8;
    }
    .copy-btn {
      margin-top: 8px;
      padding: 8px 20px;
      font-size: 0.8rem;
      background: #2e7d32;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }
    .copy-btn:hover { opacity: 0.85; }
    .loading {
      display: inline-block;
      width: 16px; height: 16px;
      border: 2px solid #fff;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .device-info {
      text-align: center;
      font-size: 0.75rem;
      color: #6b7280;
      margin-top: 14px;
    }
    .version-footer {
      text-align: center;
      font-size: 0.7rem;
      color: #9ca3af;
      margin-top: 20px;
    }

    /* 设备ID无效提示卡片 */
    .invalid-card {
      background: #fff8e1;
      border: 1px solid #ffe082;
      border-left: 4px solid #f59e0b;
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 20px;
      text-align: center;
    }
    .invalid-card .invalid-icon { font-size: 28px; margin-bottom: 6px; }
    .invalid-card .invalid-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: #92400e;
      margin-bottom: 8px;
    }
    .invalid-card .invalid-desc {
      font-size: 0.78rem;
      color: #7c5a17;
      line-height: 1.7;
      text-align: left;
    }
    .invalid-card .invalid-steps {
      font-size: 0.75rem;
      color: #7c5a17;
      line-height: 1.9;
      text-align: left;
      margin-top: 10px;
    }
    .jump-btn {
      display: inline-block;
      margin-top: 14px;
      padding: 8px 18px;
      background: #12b7f5;
      color: #fff;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 700;
      text-decoration: none;
    }
    .ghost-btn {
      margin-top: 12px;
      width: 100%;
      padding: 10px;
      background: #fff;
      border: 1px solid #e0c98a;
      border-radius: 10px;
      color: #8a6d1f;
      font-size: 0.78rem;
      cursor: pointer;
    }
    .diag-tip { font-size: 0.7rem; color: #2e7d32; margin-top: 6px; height: 14px; }

    /* 页面底部：全站唯一写群号的地方（群满换群只改这一段，不涉及逻辑代码） */
    .page-footer {
      margin-top: 22px;
      padding-top: 16px;
      border-top: 1px dashed #e5e7eb;
      text-align: center;
      font-size: 0.75rem;
      color: #6b7280;
      line-height: 1.9;
    }
    .page-footer .qq-num { color: #1a1a2e; font-weight: 700; letter-spacing: 0.5px; }
    .page-footer .qq-btn {
      display: inline-block;
      margin-left: 6px;
      padding: 4px 12px;
      background: #12b7f5;
      color: #fff;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 700;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#6c63ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></div>
    <h1>设备激活</h1>
    <p class="subtitle">输入兑换码获取激活码</p>

    <div id="invalidCard" class="invalid-card" style="display:none">
      <div class="invalid-icon">⚠️</div>
      <div class="invalid-title">未能读取到您的设备信息</div>
      <div class="invalid-desc">
        检测到设备返回的标识为「<b id="invalidRaw">NA</b>」，这是一个无效值，<b>不是您的操作问题</b>。
        继续激活会导致激活码无效，请先按下方方式联系我们处理。
      </div>
      <div class="invalid-steps">
        ① 请先<b>重启手环</b>，从手环端重新打开激活二维码再扫一次；<br>
        ② 若仍显示相同提示，请携带下方信息到<b>页面底部</b>的交流群反馈。
      </div>
      <!-- 群号刻意不写在这里：加群入口统一由页面底部提供，换群只改底部那段 HTML -->
      <a class="jump-btn" href="#qq-group">前往底部加群 →</a>
      <button class="ghost-btn" id="copyDiagBtn" onclick="copyDiagInfo()">复制设备信息（反馈给作者）</button>
      <div class="diag-tip" id="diagTip"></div>
    </div>

    <div class="steps">
      <div class="steps-title">激活步骤</div>
      <ol>
        <li>确认下方设备ID与您的设备一致</li>
        <li>输入您的 <strong>4位兑换码</strong></li>
        <li>点击激活获取 <strong>18位激活码</strong></li>
        <li>将激活码输入到手环/手表应用中</li>
      </ol>
    </div>

    <div class="field">
      <label>设备ID</label>
      <input type="text" id="deviceId" class="readonly" readonly>
    </div>
    <div id="activateForm">
      <div class="field">
        <label>兑换码</label>
        <input type="text" id="redeemCode" placeholder="输入4位兑换码" maxlength="4" autocomplete="off">
      </div>
      <button class="btn" id="activateBtn" onclick="activate()">立即激活</button>
    </div>

    <div class="result" id="result"></div>
    <div class="device-info" id="deviceInfo"></div>
    <div class="version-footer" id="version-text"></div>

    <!-- 交流群：全站唯一群号来源。群满换群只改下面这两处文本，不涉及任何逻辑代码。 -->
    <div class="page-footer" id="qq-group">
      遇到问题？加入用户交流 QQ 群：<span class="qq-num">936886288</span>
      <a class="qq-btn" href="https://qm.qq.com/q/6lmyuev7VY" target="_blank" rel="noopener">一键加群</a><br>
      问题反馈、版本更新通知、用户交流都在群里
    </div>
  </div>

  <script>
    function parseQueryParams(qs) {
      var params = {};
      if (qs && qs.charAt(0) === '?') qs = qs.substring(1);
      if (qs) {
        var pairs = qs.split('&');
        for (var i = 0; i < pairs.length; i++) {
          var eqIdx = pairs[i].indexOf('=');
          if (eqIdx >= 0) {
            params[decodeURIComponent(pairs[i].substring(0, eqIdx))] = decodeURIComponent(pairs[i].substring(eqIdx + 1));
          }
        }
      }
      return params;
    }

    function xhrFetch(url, options) {
      options = options || {};
      var result = {};
      var callbacks = [];
      var errorCallbacks = [];
      result.then = function(cb) { callbacks.push(cb); return result; };
      result.catch = function(cb) { errorCallbacks.push(cb); return result; };
      var xhr = new XMLHttpRequest();
      xhr.open(options.method || 'GET', url, true);
      if (options.timeout && options.timeout > 0) {
        xhr.timeout = options.timeout;
      }
      if (options.headers) {
        for (var k in options.headers) {
          if (options.headers.hasOwnProperty(k)) {
            xhr.setRequestHeader(k, options.headers[k]);
          }
        }
      }
      xhr.onload = function() {
        var _text = xhr.responseText;
        var res = {
          status: xhr.status,
          ok: xhr.status >= 200 && xhr.status < 300,
          _text: _text,
          json: function() {
            return {
              then: function(cb) {
                var parsed = null;
                try { parsed = JSON.parse(_text); } catch (_) { parsed = null; }
                cb(parsed);
              }
            };
          },
          text: function() { return { then: function(cb) { cb(_text); } }; }
        };
        try {
          for (var i = 0; i < callbacks.length; i++) { callbacks[i](res); }
        } catch (e) {
          for (var j = 0; j < errorCallbacks.length; j++) { errorCallbacks[j](e); }
        }
        if (typeof setLoading === 'function') setLoading(false);
      };
      xhr.onerror = function() {
        if (typeof setLoading === 'function') setLoading(false);
      };
      xhr.send(options.body || null);
      return result;
    }

    function getDeviceIdFromUrl() {
      var params = parseQueryParams(window.location.search);
      return params['deviceId'] || params['deviceid'] || params['id'] || '';
    }

    // 手环端取不到设备标识时的常见回落值。放行会得到 "NA" → "00NA" 这种共用设备指纹，
    // 导致一码一机失效。校验的是原始值（不能先归一化，否则 NA 已被补成 00NA 看不出来）。
    var INVALID_DEVICE_TOKENS = {
      'NA': 1, 'N/A': 1, 'NULL': 1, 'UNDEFINED': 1, 'NONE': 1, 'UNKNOWN': 1,
      'UNKNOW': 1, 'NIL': 1, 'NAN': 1, '-': 1, '--': 1, 'TEST': 1,
      'EMPTY': 1, 'DEFAULT': 1, 'FALSE': 1, '0': 1, '0000': 1
    };

    function isValidDeviceId(raw) {
      var s = String(raw || '').trim();
      if (!s) return false;
      if (INVALID_DEVICE_TOKENS[s.toUpperCase()]) return false;
      var alnum = s.replace(/[^0-9A-Za-z]/g, '');
      return alnum.length >= 4;
    }

    function getDeviceInfoFromUrl() {
      var params = parseQueryParams(window.location.search);
      return {
        model: params['m'] || '',
        product: params['p'] || '',
        osVersionCode: params['o'] || '',
        platformVersionCode: params['v'] || '',
        deviceType: params['t'] || '',
        screenShape: params['s'] || '',
        screenWidth: params['w'] || '',
        screenHeight: params['h'] || '',
        apiLevel: params['a'] || '',
        language: params['l'] || navigator.language || '',
        romVersion: params['r'] || '',
        source: params['c'] || '',
      };
    }

    var deviceInfo = getDeviceInfoFromUrl();

    var urlDeviceId = getDeviceIdFromUrl();
    var deviceId = urlDeviceId;
    var deviceIdInvalid = false;

    if (!deviceId) {
      // 空值：沿用本地兜底（用户直接浏览器打开的场景）
      deviceId = localStorage.getItem('deviceId') || '';
      if (!deviceId) {
        var chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
        deviceId = '';
        for (var i = 0; i < 4; i++) {
          deviceId += chars.charAt(Math.floor(Math.random() * chars.length));
        }
        localStorage.setItem('deviceId', deviceId);
      }
    } else if (!isValidDeviceId(deviceId)) {
      // 无效值：绝不落库、绝不发码，直接走引导加群
      deviceIdInvalid = true;
    }

    document.getElementById('deviceId').value = deviceId || '未获取到';
    document.getElementById('deviceInfo').textContent = '设备ID来源: ' + (urlDeviceId ? 'URL参数' : '本地生成');
    if (deviceIdInvalid) showInvalidDeviceCard(urlDeviceId);

    function setLoading(loading) {
      var btn = document.getElementById('activateBtn');
      // 无效设备ID 状态下按钮恒锁死：否则页面底部那个 xhrFetch 收尾时的 setLoading(false)
      // 会把按钮重新点亮（表单虽已隐藏，但状态不一致）
      if (deviceIdInvalid) {
        btn.disabled = true;
        btn.textContent = '设备信息异常，暂不可激活';
        return;
      }
      if (loading) {
        btn.disabled = true;
        btn.innerHTML = '<span class="loading"></span>激活中...';
      } else {
        btn.disabled = false;
        btn.innerHTML = '立即激活';
      }
    }

    // 设备ID无效：隐藏表单，展示引导卡片（加群入口统一在页面底部 #qq-group）
    function showInvalidDeviceCard(raw) {
      var card = document.getElementById('invalidCard');
      if (card) card.style.display = 'block';
      var rawEl = document.getElementById('invalidRaw');
      if (rawEl) rawEl.textContent = String(raw || '').slice(0, 40);
      var form = document.getElementById('activateForm');
      if (form) form.style.display = 'none';
      var btn = document.getElementById('activateBtn');
      if (btn) { btn.disabled = true; btn.textContent = '设备信息异常，暂不可激活'; }
    }

    // 诊断信息：一次性打包，用户粘贴到群里即可
    function buildDiagText() {
      var lines = [];
      lines.push('[EV激活异常] 设备ID无效');
      lines.push('deviceId=' + (getDeviceIdFromUrl() || '(空)'));
      lines.push('型号=' + (deviceInfo.model || '-') + ' / 产品=' + (deviceInfo.product || '-'));
      lines.push('设备类型=' + (deviceInfo.deviceType || '-') + ' 屏幕=' + (deviceInfo.screenWidth || '-') + 'x' + (deviceInfo.screenHeight || '-') + ' ' + (deviceInfo.screenShape || '-'));
      lines.push('ROM=' + (deviceInfo.romVersion || '-') + ' 平台版本=' + (deviceInfo.platformVersionCode || '-') + ' 渠道=' + (deviceInfo.source || '-'));
      lines.push('UA=' + String(navigator.userAgent || '').slice(0, 200));
      lines.push('URL=' + window.location.href);
      lines.push('时间=' + new Date().toString());
      return lines.join('\n');
    }

    function copyDiagInfo() {
      var text = buildDiagText();
      var tipEl = document.getElementById('diagTip');
      var showTip = function(ok) {
        if (tipEl) tipEl.textContent = ok ? '已复制，粘贴到群里发给作者即可' : '复制失败，请手动截图本页';
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function() {
          showTip(true);
        }).catch(function() {
          showTip(fallbackCopyText(text));
        });
      } else {
        showTip(fallbackCopyText(text));
      }
    }

    function fallbackCopyText(text) {
      try {
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.left = '-9999px';
        ta.style.top = '-9999px';
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        var ok = document.execCommand('copy');
        document.body.removeChild(ta);
        return ok;
      } catch (_) { return false; }
    }

    function fmtCode(code) {
      if (!code) return code;
      if (code.length === 18) {
        return code.substring(0, 6) + '<br>' + code.substring(6, 12) + '<br>' + code.substring(12, 18);
      }
      if (code.length === 16) {
        return code.substring(0, 4) + '<br>' + code.substring(4, 8) + '<br>' + code.substring(8, 12) + '<br>' + code.substring(12, 16);
      }
      return code;
    }

    function showResult(type, message, code) {
      var el = document.getElementById('result');
      el.className = 'result show ' + (type === 'success' ? 'success' : 'error');
      var html = '<strong>' + (type === 'success' ? '激活成功！' : '激活失败') + '</strong>';
      html += '<p style="margin-top:4px;font-size:0.85rem">' + message + '</p>';
      if (code) {
        var displayCode = fmtCode(code);
        html += '<div class="code">' + displayCode + '</div>';
        html += '<button class="copy-btn" onclick="copyCode(\'' + code + '\')">复制激活码</button>';
      }
      el.innerHTML = html;
    }

    function copyCode(code) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(code).then(function() {
          var btn = document.querySelector('.copy-btn');
          if (btn) { btn.textContent = '已复制！'; btn.style.background = '#666'; }
        }).catch(function() {
          fallbackCopy(code);
        });
      } else {
        fallbackCopy(code);
      }
    }
    function fallbackCopy(text) {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.left = '-9999px';
      ta.style.top = '-9999px';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      try {
        document.execCommand('copy');
        var btn = document.querySelector('.copy-btn');
        if (btn) { btn.textContent = '已复制！'; btn.style.background = '#666'; }
      } catch (_) {}
      document.body.removeChild(ta);
    }

    function activate() {
      // 无效设备ID 硬拦截：防控制台绕过、防按钮被误启用
      if (deviceIdInvalid) {
        showInvalidDeviceCard(getDeviceIdFromUrl() || '(空)');
        showResult('error', '设备信息异常，请按页面提示加群反馈后重试');
        return;
      }

      var codeInput = document.getElementById('redeemCode');
      var code = codeInput.value.trim();

      if (!code) {
        showResult('error', '请输入兑换码');
        return;
      }

      if (code.length !== 4) {
        showResult('error', '兑换码必须为4位');
        return;
      }

      if (!getDeviceIdFromUrl()) {
        showResult('error', '请通过手环/手表上的二维码打开本页面，直接浏览器打开无法激活');
        return;
      }

      setLoading(true);
      document.getElementById('result').className = 'result';

      var hasDeviceInfo = deviceInfo.model || deviceInfo.product || deviceInfo.deviceType;
      var xhr = xhrFetch('/api/activate', {
        method: 'POST',
        timeout: 15000,
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          deviceId: deviceId,
          redeemCode: code,
          deviceInfo: hasDeviceInfo ? deviceInfo : null
        })
      });
      setTimeout(function() {
        if (document.getElementById('activateBtn').disabled) {
          showResult('error', '请求超时，请刷新页面重试');
          setLoading(false);
        }
      }, 16000);
      xhr.then(function(res) {
        var httpStatus = res.status;
        return res.json().then(function(data) {
          console.group('📧 激活请求详情');
          console.log('HTTP Status:', httpStatus);
          console.log('Device ID:', deviceId);
          console.log('Redeem Code:', code);
          console.log('Response:', data);

          if (data.debug) {
            console.log('---');
            var emailStatus = data.debug.notification === 'sent' ? '✅ 邮件已发送' : '❌ 邮件发送失败';
            var actionLabel = data.success ? '激活成功' : '激活失败';
            console.log('📬 邮件通知 (' + actionLabel + '):', emailStatus);
            console.log('📋 原因:', data.debug.reason || 'N/A');
            if (data.debug.productId) console.log('📦 产品:', data.debug.productId);
            if (data.debug.months) console.log('📅 时长:', data.debug.months + '个月');

            if (data.debug.visitor) {
              var v = data.debug.visitor;
              console.log('👤 访客:', [v.ip, v.os, v.browser, v.device].filter(Boolean).join(' | '));
            }
          }
          console.groupEnd();

          if (data.success) {
            var msg = '请将激活码输入到手环应用中';
            if (data.naDevice) {
              var naParts = (data.naUsage || '1/5').split('/');
              var naRemain = Number(naParts[1]) - Number(naParts[0]);
              msg = '激活成功！\u26a0\ufe0f 您的设备使用临时标识，重装应用后可能需要重新激活' +
                '（该兑换码还可使用 ' + naRemain + ' 次）';
            }
            showResult('success', msg, data.activationCode);
            codeInput.value = '';
          } else if (data.code === 'DEVICE_ID_INVALID' || data.code === 'DEVICE_ID_EMPTY') {
            // 后端兜底拦截：按 code 分支，不拼群号（群号只在页面底部）
            showInvalidDeviceCard(getDeviceIdFromUrl() || '(空)');
            showResult('error', '设备信息异常，请前往页面底部加群反馈');
          } else {
            showResult('error', data.error || '激活失败，请重试');
          }
        });
      }).catch(function(e) {
        console.error('❌ 网络错误:', e.message);
        showResult('error', '网络错误，请检查网络后重试');
      }).then(function() {
        setLoading(false);
      });
    }

    document.getElementById('redeemCode').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') activate();
    });

    (function(){
      try {
        xhrFetch('/api/activate?section=visitor-track', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ path: window.location.pathname + window.location.search })
        }).catch(function(){});
      } catch(e){}
    })();

    (function(){
      xhrFetch('/api/admin/health?section=version')
        .then(function(res) { return res.json(); })
        .then(function(v) {
          var el = document.getElementById('version-text');
          if (el && v.version) {
            el.textContent = 'v' + v.version;
          }
        })
        .catch(function() {});
    })();
  </script>

  try {
    var r = new XMLHttpRequest();
    r.open('POST', '/api/admin/health?section=visit', true);
    r.setRequestHeader('Content-Type', 'application/json');
    r.send(JSON.stringify({page:location.pathname,referrer:document.referrer||'',title:document.title||''}));
