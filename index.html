<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width initial-scale=1.0">
  <title>App Auth - 激活码管理系统</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: rgba(255,255,255,0.97);
      border-radius: 24px;
      padding: 40px 44px;
      max-width: 940px;
      width: 100%;
      box-shadow: 0 30px 80px rgba(0,0,0,0.5);
      animation: slideUp 0.5s ease-out;
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .icon { text-align: center; font-size: 52px; margin-bottom: 14px; }
    h1 { text-align: center; font-size: 1.6rem; color: #1a1a2e; margin-bottom: 6px; }
    .subtitle { text-align: center; font-size: 0.88rem; color: #6b7280; margin-bottom: 28px; }

    .link-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 24px;
    }
    .link-card {
      display: block;
      padding: 16px 18px;
      background: #f8f8ff;
      border: 1px solid #e8e6ff;
      border-radius: 12px;
      text-decoration: none;
      color: #1a1a2e;
      transition: all 0.2s;
    }
    .link-card:hover {
      background: #e8e6ff;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(108,99,255,0.15);
    }
    .link-card .lc-icon { font-size: 22px; margin-bottom: 6px; }
    .link-card .lc-title { font-weight: 600; font-size: 0.92rem; margin-bottom: 3px; }
    .link-card .lc-desc { font-size: 0.76rem; color: #6b7280; }
    .link-card.primary { background: #6c63ff; border-color: #6c63ff; color: #fff; }
    .link-card.primary:hover { background: #5a52d5; box-shadow: 0 4px 16px rgba(108,99,255,0.3); }
    .link-card.primary .lc-desc { color: rgba(255,255,255,0.92); }

    .section-title {
      font-size: 0.82rem;
      font-weight: 700;
      color: #6b7280;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin: 22px 0 10px;
    }

    .filterbar { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 4px; }
    .fbtn { border: 1px solid #e8e6ff; background: #f8f8ff; color: #1a1a2e; padding: 6px 14px; border-radius: 20px; font-size: .82rem; cursor: pointer; text-decoration: none; }
    .fbtn:hover { background: #e8e6ff; }
    .fbtn.active { background: #6c63ff; border-color: #6c63ff; color: #fff; }
    .fbtn.active:hover { background: #5a52d5; }
    .sn-section { margin-top: 4px; }

    .demo-section {
      background: #fff;
      border-radius: 14px;
      padding: 14px 16px;
      border: 2px dashed #e0e0e0;
      text-align: center;
    }
    .demo-link {
      display: inline-block;
      padding: 7px 14px;
      margin: 3px;
      background: #f0f0ff;
      color: #6c63ff;
      border-radius: 8px;
      font-size: 0.76rem;
      font-family: 'SF Mono' 'Fira Code' monospace;
      text-decoration: none;
      border: 1px solid #d0d0ff;
      transition: background 0.2s;
    }
    .demo-link:hover { background: #e0e0ff; }

    @media (max-width: 480px) {
      .link-grid { grid-template-columns: 1fr; }
      .card { padding: 28px 22px; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon"><svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="#6c63ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg></div>
    <h1>激活码管理系统</h1>
    <p class="subtitle">Ev课程表 · 全站服务导航</p>

    <div id="catalog"></div>

    <div class="section-title" id="demoSectionTitle" style="display:none">Demo 测试链接</div>
    <div class="demo-section" id="demoSection" style="display:none">
      <a class="demo-link" href="/activate.html?deviceId=Aa09">设备 Aa09</a>
      <a class="demo-link" href="/activate.html?deviceId=Bb19">设备 Bb19</a>
      <a class="demo-link" href="/activate.html?deviceId=Xy99">设备 Xy99</a>
      <a class="demo-link" href="/activate.html?deviceId=TeSt">设备 TeSt</a>
    </div>
  </div>
  <script>
  (function(){
    if (window.location.search.indexOf('demo=1') !== -1) {
      var titleEl = document.getElementById('demoSectionTitle');
      var sectionEl = document.getElementById('demoSection');
      if (titleEl) titleEl.style.display = '';
      if (sectionEl) sectionEl.style.display = '';
    }
  })();
  </script>
  <script src="/js/site-nav.js"></script>
  <script>
  if (window.SiteNav) SiteNav.mountCatalog('catalog');
  </script>
  <!-- 全站统一访客埋点（P2/D1+D3）：替代此处原有的手写 XHR，避免双发。
       注：此处原本把 script 的**闭合标签**误写成了**开标签**（只差一个斜杠）。
       单独一行的开标签在 JS 里恰好是合法的比较表达式（undefined 比较 undefined），
       所以这个笔误一直没暴露成报错，只是静默地多开了一层脚本块 —— 本次一并修掉。 -->
  <script src="/js/track.js" data-group="home"></script>
<script>
(function(){
  try {
    var r = new XMLHttpRequest();
    r.open('POST', '/api/admin/health?section=visit', true);
    r.setRequestHeader('Content-Type', 'application/json');
    r.send(JSON.stringify({page:location.pathname,referrer:document.referrer||'',title:document.title||''}));
  } catch(_) {}
})();
</script>
</body>
</html>
