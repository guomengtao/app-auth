<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>App Auth - Redis Message Board</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 40px 20px;
    }

    .container {
      max-width: 640px;
      margin: 0 auto;
      background: rgba(255, 255, 255, 0.95);
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      animation: fadeIn 0.6s ease-out;
    }

    h1 {
      text-align: center;
      font-size: 2rem;
      color: #333;
      margin-bottom: 4px;
    }

    .subtitle {
      text-align: center;
      font-size: 0.9rem;
      color: #888;
      margin-bottom: 30px;
    }

    .form-group {
      display: flex;
      gap: 10px;
      margin-bottom: 24px;
    }

    .form-group input {
      flex: 1;
      padding: 12px 16px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      font-size: 1rem;
      transition: border-color 0.2s;
      outline: none;
    }

    .form-group input:focus {
      border-color: #667eea;
    }

    .form-group button {
      padding: 12px 24px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      white-space: nowrap;
    }

    .form-group button:hover {
      opacity: 0.9;
    }

    .form-group button:active {
      transform: scale(0.97);
    }

    .form-group button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .status {
      text-align: center;
      font-size: 0.85rem;
      min-height: 20px;
      margin-bottom: 16px;
      transition: color 0.3s;
    }

    .status.success {
      color: #2e7d32;
    }

    .status.error {
      color: #c62828;
    }

    .messages-header {
      font-size: 0.85rem;
      font-weight: 600;
      color: #999;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .messages-header button {
      background: none;
      border: 1px solid #ddd;
      padding: 4px 12px;
      border-radius: 6px;
      font-size: 0.75rem;
      cursor: pointer;
      color: #666;
    }

    .messages-header button:hover {
      background: #f5f5f5;
    }

    .message-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .message-item {
      padding: 14px 16px;
      background: #f8f9ff;
      border-radius: 10px;
      border-left: 3px solid #667eea;
      animation: slideIn 0.3s ease-out;
    }

    .message-item .text {
      font-size: 0.95rem;
      color: #333;
      word-break: break-word;
    }

    .message-item .time {
      font-size: 0.75rem;
      color: #aaa;
      margin-top: 4px;
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: #ccc;
      font-size: 0.9rem;
    }

    .loading {
      text-align: center;
      padding: 20px;
      color: #aaa;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateX(-10px); }
      to { opacity: 1; transform: translateX(0); }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>hello vercel</h1>
    <p class="subtitle">Message Board powered by Upstash Redis</p>

    <div class="form-group">
      <input type="text" id="messageInput" placeholder="Write a message..." maxlength="500" autocomplete="off" />
      <button id="publishBtn" onclick="publishMessage()">Publish</button>
    </div>

    <div class="status" id="status"></div>

    <div class="messages-header">
      <span>Messages</span>
      <button onclick="loadMessages()">Refresh</button>
    </div>

    <div id="messagesContainer">
      <div class="loading">Loading...</div>
    </div>
  </div>

  <script>
    const input = document.getElementById("messageInput");
    const btn = document.getElementById("publishBtn");
    const status = document.getElementById("status");
    const container = document.getElementById("messagesContainer");

    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") publishMessage();
    });

    function setStatus(msg, type) {
      status.textContent = msg;
      status.className = "status " + type;
      if (type === "success") setTimeout(() => { status.textContent = ""; status.className = "status"; }, 3000);
    }

    async function publishMessage() {
      const message = input.value.trim();
      if (!message) return;

      btn.disabled = true;
      setStatus("Publishing...", "");

      try {
        const res = await fetch("/api/publish", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message }),
        });

        const data = await res.json();

        if (res.ok) {
          input.value = "";
          setStatus("Published!", "success");
          loadMessages();
        } else {
          setStatus(data.error || "Publish failed", "error");
        }
      } catch (err) {
        setStatus("Network error. Please try again.", "error");
      } finally {
        btn.disabled = false;
      }
    }

    async function loadMessages() {
      container.innerHTML = '<div class="loading">Loading...</div>';

      try {
        const res = await fetch("/api/messages");
        const data = await res.json();

        if (!data.messages || data.messages.length === 0) {
          container.innerHTML = '<div class="empty-state">No messages yet. Be the first to publish!</div>';
          return;
        }

        container.innerHTML = '<ul class="message-list">' +
          data.messages.map((m) =>
            '<li class="message-item">' +
              '<div class="text">' + escapeHtml(m.message) + '</div>' +
              '<div class="time">' + formatTime(m.createdAt) + '</div>' +
            '</li>'
          ).join("") +
        '</ul>';
      } catch (err) {
        container.innerHTML = '<div class="empty-state">Failed to load messages.</div>';
      }
    }

    function escapeHtml(text) {
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }

    function formatTime(iso) {
      const d = new Date(iso);
      const now = new Date();
      const diff = now - d;
      if (diff < 60000) return "just now";
      if (diff < 3600000) return Math.floor(diff / 60000) + "m ago";
      if (diff < 86400000) return Math.floor(diff / 3600000) + "h ago";
      return d.toLocaleDateString("en-US", { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
    }

    loadMessages();
  </script>
</body>
</html>
