<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>App Auth - 激活码管理系统</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: rgba(255,255,255,0.97);
      border-radius: 24px;
      padding: 48px 40px;
      max-width: 600px;
      width: 100%;
      box-shadow: 0 30px 80px rgba(0,0,0,0.5);
      animation: slideUp 0.5s ease-out;
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .icon { text-align: center; font-size: 56px; margin-bottom: 16px; }
    h1 { text-align: center; font-size: 1.8rem; color: #1a1a2e; margin-bottom: 6px; }
    .subtitle { text-align: center; font-size: 0.9rem; color: #888; margin-bottom: 30px; }

    .demo-section {
      background: #fff;
      border-radius: 14px;
      padding: 16px;
      border: 2px dashed #e0e0e0;
      text-align: center;
    }
    .demo-section h4 {
      font-size: 0.8rem;
      color: #888;
      margin-bottom: 10px;
      font-weight: 600;
    }
    .demo-link {
      display: inline-block;
      padding: 8px 16px;
      margin: 4px;
      background: #f0f0ff;
      color: #6c63ff;
      border-radius: 8px;
      font-size: 0.78rem;
      font-family: 'SF Mono', 'Fira Code', monospace;
      text-decoration: none;
      border: 1px solid #d0d0ff;
      transition: background 0.2s;
    }
    .demo-link:hover { background: #e0e0ff; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🛡️</div>
    <h1>激活码管理系统</h1>
    <p class="subtitle">Demo 测试链接</p>

    <div class="demo-section">
      <h4>Demo 测试链接（带设备ID）</h4>
      <a class="demo-link" href="/activate.html?deviceId=Aa09">设备 Aa09</a>
      <a class="demo-link" href="/activate.html?deviceId=Bb19">设备 Bb19</a>
      <a class="demo-link" href="/activate.html?deviceId=Xy99">设备 Xy99</a>
      <a class="demo-link" href="/activate.html?deviceId=TeSt">设备 TeSt</a>
    </div>
  </div>
</body>
</html>
