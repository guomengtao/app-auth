<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>App Auth - Vercel Demo</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      text-align: center;
      background: rgba(255, 255, 255, 0.95);
      padding: 60px 80px;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      animation: fadeIn 1s ease-out;
    }

    h1 {
      font-size: 3.5rem;
      color: #333;
      margin-bottom: 10px;
      letter-spacing: -1px;
    }

    p {
      font-size: 1.2rem;
      color: #666;
      margin-top: 10px;
    }

    .badge {
      display: inline-block;
      margin-top: 20px;
      padding: 8px 20px;
      background: #000;
      color: #fff;
      border-radius: 50px;
      font-size: 0.9rem;
      font-weight: 500;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>hello vercel</h1>
    <p>Welcome to the App Auth Demo</p>
    <span class="badge">Deployed on Vercel</span>
  </div>
</body>
</html>
