<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Ev课程表激活</title>
<style>
  body { font-family: -apple-system, "PingFang SC", sans-serif; margin: 0; padding: 24px 16px;
         background: #f5f6f7; color: #1a1a1a; text-align: center; }
  .card { max-width: 420px; margin: 0 auto; background: #fff; border-radius: 16px;
          padding: 28px 20px; box-shadow: 0 2px 12px rgba(0,0,0,.06); }
  h1 { font-size: 18px; margin: 0 0 6px; }
  .sub { font-size: 13px; color: #888; margin-bottom: 22px; }
  .code { font-size: 44px; font-weight: 700; letter-spacing: 8px; color: #c7254e;
          background: #faf1f2; border-radius: 12px; padding: 14px 0; margin-bottom: 8px; }
  .codelabel { font-size: 12px; color: #aaa; margin-bottom: 24px; }
  .btn { display: block; width: 100%; box-sizing: border-box; padding: 14px 0; border-radius: 10px;
         background: #07c160; color: #fff; font-size: 16px; font-weight: 600;
         text-decoration: none; margin-bottom: 12px; }
  .btn.gray { background: #576b95; }
  .hint { font-size: 12px; color: #999; line-height: 1.7; text-align: left; margin-top: 18px;
          border-top: 1px solid #eee; padding-top: 14px; }
  .wx { display: none; background: #fff7e6; border-radius: 10px; padding: 12px;
        font-size: 13px; color: #b26b00; margin-bottom: 16px; text-align: left; line-height: 1.6; }
  .pc { display: none; background: #fff7e6; border-radius: 10px; padding: 12px;
        font-size: 13px; color: #b26b00; margin-bottom: 16px; text-align: left; line-height: 1.6; }
  .trace { display: none; font-size: 11px; color: #9aa0a6; margin-top: 14px; letter-spacing: .3px; }
</style>
</head>
<body>
<div class="card">
  <h1>Ev课程表激活</h1>
  <div class="sub">点下方按钮自动打开 App 填码激活（安卓手机）</div>
  <div class="wx">⚠️ 你在微信里打开了本页。微信会拦截 App 跳转，请点右上角「···」→ 选择「在浏览器打开」，再用按钮激活。</div>
  <div class="pc">🖥️ 你在<b>电脑</b>上打开了本页。自动激活需要在<b>手机</b>上完成：请把这个链接发到手机（微信 / 短信均可），用手机浏览器打开后再点按钮。</div>
  <div class="code" id="code">------</div>
  <div class="codelabel">兑换码（拉不起来就手工输入这个）</div>
  <a class="btn" id="openbtn" href="#">打开 Ev课程表同步器 自动激活</a>
  <a class="btn gray" id="copybtn" href="javascript:void(0)">复制兑换码</a>
  <div class="hint">
    预期行为：点按钮 → 弹「是否打开 Ev课程表」→ 确认后进入激活页，兑换码已自动填入并开始激活。<br>
    拉不起来就手工输入：打开 App → 高级版 → 输入上面的兑换码 → 一键激活。
  </div>
  <div class="trace" id="trace"></div>
</div>
<script>
  var q = {};
  location.search.replace(/^\?/, "").split("&").forEach(function (p) {
    var i = p.indexOf("=");
    if (i > 0) q[decodeURIComponent(p.slice(0, i))] = decodeURIComponent(p.slice(i + 1));
  });
  var code = (q.code || "").replace(/[^0-9A-Za-z]/g, "").slice(0, 8) || "A1B2";
  var scheme = (q.scheme || "evsched").replace(/[^a-z]/g, "");
  // 白名单：只允许项目内两个 scheme，防止本页被当成任意 scheme 跳板
  if (scheme !== "evsched" && scheme !== "evops") scheme = "evsched";
  // 溯源参数（P1 §4.1）：u=用户识别码 / c=渠道 / o=订单号。
  // ⚠️ 全部做白名单清洗后再拼进深链 —— 本页链接会出现在私信里，必须假定参数是脏的。
  var uid = (q.u || "").replace(/[^0-9A-Za-z_-]/g, "").slice(0, 32);
  var chn = (q.c || "").replace(/[^0-9A-Za-z_-]/g, "").slice(0, 32);
  var ord = (q.o || "").replace(/[^0-9A-Za-z_-]/g, "").slice(0, 64);
  document.getElementById("code").textContent = code;
  var deep = scheme + "://activate?code=" + code;
  if (uid) deep += "&u=" + uid;
  if (chn) deep += "&c=" + chn;
  if (ord) deep += "&o=" + ord;
  document.getElementById("openbtn").href = deep;
  // 溯源码展示：方便用户截图给客服核对（有才显示，没有就当老链接）
  if (uid || chn) {
    var el = document.getElementById("trace");
    el.textContent = "溯源：" + (uid ? uid : "—") + (chn ? " · " + chn : "");
    el.style.display = "block";
  }
  // 全链路追踪：「链接被点开」唯一的采集点。P2/D2 起改用全站统一脚本
  // （见页尾 data-group="activate" 那个标签），此处不再手写 XHR。
  // u/c/o/g 都在 location.search 里，服务端会拆进 params 列、group 进 payload.group。
  if (/MicroMessenger/i.test(navigator.userAgent)) {
    document.querySelector(".wx").style.display = "block";
  }
  // 电脑端检测：本页的自动激活只能在手机上完成
  var isTouch = ("ontouchstart" in window) || (navigator.maxTouchPoints > 0);
  var isMobileUA = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
  if (!isTouch && !isMobileUA) {
    document.querySelector(".pc").style.display = "block";
  }
  document.getElementById("copybtn").onclick = function () {
    var done = function () { this.textContent = "已复制 ✓"; }.bind(this);
    if (navigator.clipboard) {
      navigator.clipboard.writeText(code).then(done).catch(function () { prompt("手动复制：", code); });
    } else { prompt("手动复制：", code); }
  };
</script>
<!-- 全站统一访客埋点（P2/D1+D2）：替代此前手写的 XHR，避免两处并存导致双发 -->
<script src="/js/track.js" data-group="activate"></script>
</body>
</html>
