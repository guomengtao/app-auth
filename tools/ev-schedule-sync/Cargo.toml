[package]
name = "ev-schedule-sync"
version = "1.0.0"
edition = "2021"
description = "EV Schedule Synchronizer — multi-format course schedule import/export plugin for AstroBox V2"
authors = ["EV Schedule Team"]
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
scraper = "0.20"
log = "0.4"
uuid = { version = "1", features = ["v4"] }

[features]
default = []
astrobox-host = []

[profile.release]
opt-level = "s"
lto = true
strip = true