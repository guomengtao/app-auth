[package]
name = "ev-schedule-sync"
version = "1.0.4"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = { version = "0.57", features = ["async", "async-spawn"] }
tracing = "0.1"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
anyhow = "1.0"
uuid = { version = "1", features = ["v4"] }