[package]
name = "ev-schedule-sync"
version = "1.0.6"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
astrobox-ng-wit = "0.3"
tracing = "0.1"
waki = "0.5.1"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
anyhow = "1.0"
uuid = { version = "1", features = ["v4"] }