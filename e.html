<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>课表 · 网页编辑</title>
<style>
  :root{
    --bg:#f4f6fa; --card:#ffffff; --line:#e6e9f0; --soft:#eef1f6;
    --text:#151922; --text2:#5b6376; --muted:#8b93a5;
    --accent:#4f6bff; --accent-soft:#eef1ff;
    --ok:#18b26b; --warn:#e6a23c; --danger:#e05252;
    --shadow:0 1px 2px rgba(16,24,40,.05), 0 10px 26px -16px rgba(16,24,40,.22);
    --r:16px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0e1015; --card:#171a21; --line:#262b36; --soft:#20242d;
      --text:#e9ecf2; --text2:#a3abbc; --muted:#7c8496;
      --accent:#6f88ff; --accent-soft:#1d2335;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 28px -16px rgba(0,0,0,.75);
    }
  }
  *{box-sizing:border-box}
  html,body{-webkit-text-size-adjust:100%}
  body{
    margin:0;background:var(--bg);color:var(--text);
    font:15px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    padding:22px 16px 116px;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:720px;margin:0 auto}

  /* ---------- 头部 ---------- */
  header{display:flex;align-items:flex-start;gap:10px;margin-bottom:4px}
  .htext{flex:1;min-width:0}
  h1{font-size:21px;line-height:1.3;margin:0;font-weight:700;letter-spacing:-.01em;
     overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sub{color:var(--muted);font-size:12.5px;margin-top:3px;font-variant-numeric:tabular-nums}
  .badge{font-size:11.5px;font-weight:600;padding:4px 9px;border-radius:999px;
     background:var(--soft);color:var(--text2);white-space:nowrap;margin-top:3px}
  .badge.on{background:rgba(24,178,107,.13);color:var(--ok)}
  .headbtn{font:inherit;font-size:13px;font-weight:600;padding:6px 13px;border-radius:999px;
     border:1px solid var(--line);background:var(--card);color:var(--text);cursor:pointer;margin-top:1px}
  .headbtn:active{transform:scale(.97)}
  .headbtn.ghost{color:var(--muted)}

  /* ---------- 按天分组 ---------- */
  .dayblock{margin-top:20px}
  .dayhead{display:flex;align-items:center;gap:8px;margin:0 2px 8px;
     font-size:13px;font-weight:600;color:var(--text2);letter-spacing:.02em}
  .dot{width:8px;height:8px;border-radius:3px;background:var(--muted);flex:none}
  .cnt{margin-left:auto;font-weight:500;color:var(--muted);font-size:12px}
  .courses{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}

  .course{position:relative;padding:13px 15px 13px 19px;border-top:1px solid var(--soft)}
  .course:first-child{border-top:0}
  .course::before{content:"";position:absolute;left:7px;top:11px;bottom:11px;width:3px;
     border-radius:2px;background:var(--dc,var(--accent));opacity:.85}
  .course.tap{cursor:pointer;transition:background .12s}
  .course.tap:hover{background:rgba(127,127,127,.05)}
  .course.tap:active{background:rgba(127,127,127,.09)}
  .crow{display:flex;align-items:center;gap:10px}
  .cname{flex:1;min-width:0;font-size:16.5px;font-weight:650;letter-spacing:-.01em;
     overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pill{flex:none;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;
     padding:3px 9px;border-radius:999px;background:var(--soft);color:var(--text2)}
  .pill.none{opacity:.5;font-weight:500}
  .cmeta{margin-top:3px;font-size:12.5px;color:var(--muted);overflow:hidden;
     text-overflow:ellipsis;white-space:nowrap}
  .cmeta.dim{opacity:.55}

  .empty{color:var(--muted);text-align:center;padding:34px 16px;font-size:13.5px}
  .card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow)}
  .card.err{box-shadow:none;border:1px solid rgba(230,162,60,.5)}
  .foot{color:var(--muted);font-size:12px;text-align:center;margin-top:26px;line-height:1.7;padding:0 8px}
  code{background:var(--soft);padding:1px 5px;border-radius:5px;font-size:12px}

  /* ---------- 底部操作条 ---------- */
  .bar{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--card) 92%,transparent);
     background:var(--card);border-top:1px solid var(--line);display:none;
     padding:10px 16px calc(10px + env(safe-area-inset-bottom));z-index:15}
  .bar.show{display:block}
  .barin{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:10px}
  .hint{flex:1;min-width:0;font-size:12px;color:var(--muted);
     overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  .btn{font:inherit;font-size:13px;font-weight:600;padding:9px 14px;border-radius:11px;
     border:1px solid var(--line);background:var(--card);color:var(--text);cursor:pointer;
     transition:transform .12s,background .12s}
  .btn:active{transform:scale(.97)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.plain{border-color:transparent;background:var(--soft)}
  .btn.danger{color:var(--danger)}

  /* ---------- 底部抽屉 ---------- */
  .mask{position:fixed;inset:0;background:rgba(10,12,18,.44);-webkit-backdrop-filter:blur(2px);
     backdrop-filter:blur(2px);display:none;align-items:flex-end;justify-content:center;z-index:40}
  .mask.show{display:flex;animation:fade .18s ease}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .sheet{background:var(--card);width:100%;max-width:520px;border-radius:24px 24px 0 0;
     padding:8px 18px calc(18px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;
     box-shadow:0 -12px 44px rgba(0,0,0,.22);animation:up .22s cubic-bezier(.2,.8,.3,1)}
  @keyframes up{from{transform:translateY(18px);opacity:.6}to{transform:none;opacity:1}}
  .grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:6px auto 14px}
  .sheet h3{margin:0 0 4px;font-size:17px;font-weight:700;letter-spacing:-.01em}
  .sheet .tip{font-size:12px;color:var(--muted);margin:0 0 16px}

  .field{margin-bottom:14px}
  .field > label{display:block;font-size:11.5px;font-weight:600;color:var(--muted);
     letter-spacing:.06em;margin-bottom:6px;text-transform:uppercase}
  .field input{width:100%;font:inherit;font-size:15px;padding:11px 12px;border-radius:11px;
     border:1px solid var(--line);background:var(--bg);color:var(--text);outline:none;transition:.15s}
  .field input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);background:var(--card)}
  .field input::placeholder{color:var(--muted);opacity:.8}
  /* datalist 会带出一个下拉箭头，看起来像 select，去掉 */
  #fName::-webkit-calendar-picker-indicator{display:none!important;opacity:0}
  #fName::-webkit-list-button{-webkit-appearance:none;display:none}

  /* 星期 chips */
  .chips{display:flex;gap:6px}
  .chip{flex:1;min-width:0;font:inherit;font-size:12.5px;font-weight:600;padding:9px 0;
     border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text2);
     cursor:pointer;transition:.13s;text-align:center}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#fff}

  /* 快捷时段 */
  .quicks{display:flex;gap:7px;overflow-x:auto;padding:1px 0 3px;margin-bottom:11px;
     scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .quicks::-webkit-scrollbar{display:none}
  .quick{flex:none;font:inherit;font-size:12.5px;font-weight:500;font-variant-numeric:tabular-nums;
     padding:7px 11px;border-radius:999px;border:1px solid var(--line);background:var(--bg);
     color:var(--text2);cursor:pointer;transition:.13s;white-space:nowrap}
  .quick.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}

  .timerow{display:flex;align-items:center;gap:10px}
  .timerow .tfield{flex:1;min-width:0}
  .timerow .arrow{color:var(--muted);font-size:13px;padding-top:2px;flex:none}
  /* 时间输入：可任意分钟，手机弹数字键盘 */
  .tin{width:100%;font:inherit;font-size:17px;font-weight:650;font-variant-numeric:tabular-nums;
     letter-spacing:.02em;text-align:center;padding:12px 8px;min-height:46px;
     border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);outline:none;
     transition:border-color .15s,box-shadow .15s;-webkit-appearance:none;appearance:none}
  .tin::placeholder{font-weight:500;letter-spacing:0;color:var(--muted);opacity:.65}
  .tin:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);background:var(--card)}
  .tin.bad{border-color:var(--danger);box-shadow:0 0 0 3px rgba(224,82,82,.14)}
  .thint{margin:8px 1px 0;font-size:11.5px;color:var(--muted);line-height:1.5}
  /* iOS 输入框 <16px 会触发页面自动缩放，统一拉到 16px */
  .field input{font-size:16px}
  .chip,.quick,.btn,.tin,.headbtn{touch-action:manipulation}

  .acts{display:flex;gap:9px;margin-top:20px;position:sticky;bottom:0;
     background:linear-gradient(to top,var(--card) 72%,transparent);padding-top:10px}
  .acts .btn{flex:1;padding:12px}

  .toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(6px);
     background:var(--text);color:var(--bg);border-radius:999px;padding:9px 16px;font-size:13px;
     font-weight:500;opacity:0;transition:.2s;pointer-events:none;z-index:60;max-width:88vw;text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="htext">
      <h1 id="title">课表</h1>
      <div class="sub" id="sub">正在读取…</div>
    </div>
    <span class="badge" id="badge">只读</span>
    <button class="headbtn" id="editBtn" style="display:none">编辑</button>
  </header>
  <div id="list"></div>
  <div class="foot" id="foot">
    数据由手机同步至云端 · 网页改动会写回云端，手环下次同步时更新
  </div>
</div>

<div class="bar" id="bar">
  <div class="barin">
    <span class="hint" id="barHint">编辑中 · 改完记着点保存</span>
    <button class="btn plain" id="addBtn">+ 加课程</button>
    <button class="btn primary" id="saveBtn">保存</button>
  </div>
</div>

<div class="mask" id="mask">
  <div class="sheet">
    <div class="grab"></div>
    <h3 id="sheetTitle">课程</h3>
    <p class="tip" id="sheetTip">填完点确定，页面里还没写进云端</p>

    <div class="field">
      <label>课程名</label>
      <input id="fName" maxlength="40" placeholder="例如 高等数学" list="nameHints" autocomplete="off">
      <datalist id="nameHints">
        <option value="高等数学"></option>
        <option value="大学物理"></option>
        <option value="线性代数"></option>
        <option value="大学英语"></option>
        <option value="程序设计"></option>
        <option value="体育"></option>
      </datalist>
    </div>

    <div class="field">
      <label>星期</label>
      <div class="chips" id="dayChips">
        <button type="button" class="chip" data-d="1">一</button>
        <button type="button" class="chip" data-d="2">二</button>
        <button type="button" class="chip" data-d="3">三</button>
        <button type="button" class="chip" data-d="4">四</button>
        <button type="button" class="chip" data-d="5">五</button>
        <button type="button" class="chip" data-d="6">六</button>
        <button type="button" class="chip" data-d="7">日</button>
      </div>
    </div>

    <div class="field">
      <label>时间</label>
      <div class="quicks" id="quicks">
        <button type="button" class="quick" data-s="08:00" data-e="09:40">08:00–09:40</button>
        <button type="button" class="quick" data-s="10:00" data-e="11:40">10:00–11:40</button>
        <button type="button" class="quick" data-s="14:00" data-e="15:40">14:00–15:40</button>
        <button type="button" class="quick" data-s="16:00" data-e="17:40">16:00–17:40</button>
        <button type="button" class="quick" data-s="19:00" data-e="20:40">19:00–20:40</button>
      </div>
      <div class="timerow">
        <div class="tfield">
          <input class="tin" id="fStart" type="text" inputmode="numeric" maxlength="5"
                 autocomplete="off" enterkeyhint="next" placeholder="08:00">
        </div>
        <span class="arrow">→</span>
        <div class="tfield">
          <input class="tin" id="fEnd" type="text" inputmode="numeric" maxlength="5"
                 autocomplete="off" enterkeyhint="done" placeholder="09:40">
        </div>
      </div>
      <p class="thint">任意分钟都能填：<b>8:15</b> / <b>815</b> / <b>8点15</b> 都认；只写 <b>8</b> 算 08:00；留空 = 不排时间</p>
    </div>

    <div class="field">
      <label>教室</label>
      <input id="fRoom" maxlength="30" placeholder="选填，例如 教三-201">
    </div>
    <div class="field">
      <label>教师</label>
      <input id="fTeacher" maxlength="20" placeholder="选填">
    </div>

    <div class="acts">
      <button class="btn plain" id="cancelBtn">取消</button>
      <button class="btn danger" id="delBtn" style="display:none">删除</button>
      <button class="btn primary" id="okBtn">确定</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  var DAYS = ["周一","周二","周三","周四","周五","周六","周日"];
  var DAYC = ["#5b8def","#18b26b","#e6a23c","#e0559a","#8b6cf0","#22b3c4","#f0803c"];
  var elTitle = document.getElementById("title");
  var elSub   = document.getElementById("sub");
  var elList  = document.getElementById("list");
  var elBadge = document.getElementById("badge");
  var elEdit  = document.getElementById("editBtn");
  var elBar   = document.getElementById("bar");
  var elFoot  = document.getElementById("foot");
  var elStart = document.getElementById("fStart");
  var elEnd   = document.getElementById("fEnd");

  var S = { guid:"", code:"", token:"", editToken:"", editUntil:null,
            rev:0, name:"", courses:[], editing:false, editingIdx:-1 };

  // 两种地址都支持：
  //   新：/e/<10位短码>                     ← 推荐，短码即读凭据
  //   旧：/e/<watchKey>/<guid>?t=<token>    ← 过渡期保留，已发出去的链接不能失效
  function parse(){
    var parts = location.pathname.split("/").filter(Boolean);
    var q = new URLSearchParams(location.search);
    if (parts.length === 2) return { code: decodeURIComponent(parts[1]), guid: "", token: "" };
    var guid = parts.length >= 3 ? decodeURIComponent(parts[2]) : "";
    return { guid: guid, token: q.get("t") || "" };
  }

  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  function toast(msg){
    var t = document.getElementById("toast");
    t.textContent = msg; t.classList.add("show");
    clearTimeout(t._h); t._h = setTimeout(function(){ t.classList.remove("show"); }, 2200);
  }
  function fail(msg, hint){
    elSub.textContent = msg;
    elList.innerHTML = '<div class="card err"><div class="empty">' + (hint || "") + '</div></div>';
  }

  function pad(n){ return (n < 10 ? "0" : "") + n; }
  function hhmm(v){
    if (v == null || v === "") return "";
    if (typeof v === "string" && v.indexOf(":") > 0) return v.slice(0,5);
    var n = Number(v);
    if (isNaN(n)) return String(v);
    if (n > 1000) n = Math.round(n / 60);      // 分钟数兜底
    var h = Math.floor(n / 60), m = n % 60;
    return pad(h) + ":" + pad(m);
  }
  function toMin(s){
    if (!s) return 0;
    var p = String(s).split(":");
    return (parseInt(p[0],10) || 0) * 60 + (parseInt(p[1],10) || 0);
  }
  function addMin(s, delta){
    var m = toMin(s) + delta;
    if (m < 0) m = 0; if (m > 23*60+59) m = 23*60+59;
    return pad(Math.floor(m/60)) + ":" + pad(m%60);
  }
  function dayOf(c){
    var d = Number(c.day != null ? c.day : c.weekday);
    if (isNaN(d)) d = 0;
    return (d >= 1 && d <= 7) ? d : 1;
  }
  function startOf(c){ return hhmm(c.start != null ? c.start : c.begin); }
  function endOf(c){ return hhmm(c.end != null ? c.end : c.finish); }
  function timeText(c){
    var s = startOf(c), e = endOf(c);
    return s && e ? (s + "–" + e) : (s || e || "");
  }
  function dayColor(d){ return DAYC[(d - 1) % 7]; }

  function render(){
    var byDay = {};
    S.courses.forEach(function(c, i){
      var d = dayOf(c);
      (byDay[d] = byDay[d] || []).push({ c:c, i:i });
    });
    var days = Object.keys(byDay).map(Number).sort(function(a,b){ return a-b; });
    if (!days.length){
      elList.innerHTML = '<div class="card"><div class="empty">这张课表还没有课程'
        + (S.editing ? '，点下面「+ 加课程」开始' : '') + '</div></div>';
      elSub.textContent = "共 0 门课 · 云端 rev " + S.rev + (S.editToken ? " · 可编辑" : " · 只读");
      return;
    }
    var html = "";
    days.forEach(function(d){
      var arr = byDay[d].slice().sort(function(a,b){
        return toMin(startOf(a.c)) - toMin(startOf(b.c));
      });
      var dc = dayColor(d);
      html += '<section class="dayblock">'
            + '<div class="dayhead"><span class="dot" style="background:' + dc + '"></span>'
            + (DAYS[d-1] || ("第" + d + "天"))
            + '<span class="cnt">' + arr.length + ' 节</span></div>'
            + '<div class="courses">';
      arr.forEach(function(o){
        var c = o.c;
        var meta = [c.room || c.place || "", c.teacher || ""].filter(Boolean).join(" · ");
        var tt = timeText(c);
        html += '<div class="course' + (S.editing ? ' tap' : '') + '" data-i="' + o.i + '"'
              + ' style="--dc:' + dc + '">'
              + '<div class="crow"><div class="cname">' + esc(c.name || c.title || "未命名") + '</div>'
              + (tt ? '<span class="pill">' + esc(tt) + '</span>'
                    : '<span class="pill none">未填时间</span>')
              + '</div>'
              + (meta ? '<div class="cmeta">' + esc(meta) + '</div>'
                      : '<div class="cmeta dim">未填教室 / 教师</div>')
              + '</div>';
      });
      html += '</div></section>';
    });
    elList.innerHTML = html;
    if (S.editing){
      Array.prototype.forEach.call(elList.querySelectorAll(".course.tap"), function(el){
        el.addEventListener("click", function(){ openSheet(parseInt(el.getAttribute("data-i"), 10)); });
      });
    }
    elSub.textContent = "共 " + S.courses.length + " 门课 · 云端 rev " + S.rev
      + (S.editToken ? " · 可编辑" : " · 只读");
  }

  function setEditing(on){
    S.editing = on;
    elBadge.textContent = on ? "编辑中" : (S.editToken ? "可编辑" : "只读");
    elBadge.className = "badge" + (on ? " on" : "");
    elBar.classList.toggle("show", on);
    elEdit.textContent = on ? "完成" : "编辑";
    if (!on) S.editingIdx = -1;
    render();
  }

  // ---------- 时间输入：支持任意分钟 ----------
  // 认这些写法：08:15 / 8:15 / 815 / 0815 / 8.15 / 8点15 / 8（=08:00）
  // 解析不出合法时间返回 ""，交给调用方标红提示。
  function parseTime(str){
    var s = String(str == null ? "" : str).trim();
    if (!s) return "";
    s = s.replace(/[点時时時．.，,：\s]/g, ":");
    var h = null, m = null, mm;
    if ((mm = s.match(/^(\d{1,2}):(\d{1,2})$/))){ h = +mm[1]; m = +mm[2]; }
    else if (/^\d{1,2}$/.test(s)){ h = +s; m = 0; }
    else if (/^\d{3,4}$/.test(s)){ h = +s.slice(0, s.length - 2); m = +s.slice(-2); }
    if (h === null || isNaN(h) || isNaN(m) || h > 23 || m > 59) return "";
    return pad(h) + ":" + pad(m);
  }
  // 失焦/提交前规范化：合法就改写成 HH:MM，非法标红返回 ""
  function normField(el){
    var raw = el.value.trim();
    if (!raw){ el.classList.remove("bad"); return ""; }
    var v = parseTime(raw);
    if (!v){ el.classList.add("bad"); return ""; }
    el.value = v; el.classList.remove("bad");
    return v;
  }
  function setTimeValue(el, v){
    el.value = v || "";
    el.classList.remove("bad");
  }
  function syncQuickActive(){
    var s = elStart.value, e = elEnd.value;
    Array.prototype.forEach.call(document.querySelectorAll("#quicks .quick"), function(b){
      b.classList.toggle("on", b.getAttribute("data-s") === s && b.getAttribute("data-e") === e);
    });
  }

  // ---------- 表单 ----------
  function setDayChip(d){
    Array.prototype.forEach.call(document.querySelectorAll("#dayChips .chip"), function(b){
      b.classList.toggle("on", Number(b.getAttribute("data-d")) === d);
    });
  }
  function getDayChip(){
    var on = document.querySelector("#dayChips .chip.on");
    return on ? parseInt(on.getAttribute("data-d"), 10) : 1;
  }

  function openSheet(i){
    var c = i >= 0 ? S.courses[i] : {};
    S.editingIdx = i;
    document.getElementById("sheetTitle").textContent = i >= 0 ? "改课程" : "加课程";
    document.getElementById("sheetTip").textContent = i >= 0
      ? "修改后点确定，页面里还没写进云端" : "填完点确定，页面里还没写进云端";
    document.getElementById("fName").value = c.name || c.title || "";
    setDayChip(dayOf(c));
    document.getElementById("fRoom").value = c.room || c.place || "";
    setTimeValue(elStart, startOf(c) || (i < 0 ? "08:00" : ""));
    setTimeValue(elEnd, endOf(c) || (i < 0 ? "09:40" : ""));
    // 新建时结束时间是「自动填的」，开始时间一改就跟着走；用户自己动过结束就不再覆盖
    elEnd.dataset.auto = (i < 0 && !endOf(c)) ? "1" : "";
    syncQuickActive();
    document.getElementById("fTeacher").value = c.teacher || "";
    document.getElementById("delBtn").style.display = i >= 0 ? "" : "none";
    document.getElementById("mask").classList.add("show");
    setTimeout(function(){ if (i < 0) document.getElementById("fName").focus(); }, 220);
  }
  function closeSheet(){ document.getElementById("mask").classList.remove("show"); }

  function submitSheet(){
    var name = document.getElementById("fName").value.trim();
    if (!name){ toast("课程名不能为空"); return; }
    var s = normField(elStart), e = normField(elEnd);
    if ((elStart.value.trim() && !s) || (elEnd.value.trim() && !e)){
      toast("时间写法不对，示例 08:15 或 815"); return;
    }
    if (s && e && toMin(e) <= toMin(s)){ toast("结束时间要晚于开始时间"); return; }
    var base = S.editingIdx >= 0 ? S.courses[S.editingIdx] : {};
    var out = {};
    // 保留原对象里我们不认识的字段，避免把扩展字段洗掉
    for (var k in base) if (Object.prototype.hasOwnProperty.call(base, k)) out[k] = base[k];
    out.name = name;
    out.day = getDayChip();
    var room = document.getElementById("fRoom").value.trim();
    var teacher = document.getElementById("fTeacher").value.trim();
    out.start = s || null;
    out.end = e || null;
    out.room = room;
    out.teacher = teacher;
    // 老字段名一并同步，手环端两种读法都能拿到
    if ("begin" in base || !("start" in base)) out.begin = s || null;
    if ("finish" in base || !("end" in base)) out.finish = e || null;
    if ("place" in base || !("room" in base)) out.place = room;

    if (S.editingIdx >= 0) S.courses[S.editingIdx] = out;
    else S.courses.push(out);
    closeSheet(); render();
  }

  function deleteCurrent(){
    if (S.editingIdx < 0) return;
    S.courses.splice(S.editingIdx, 1);
    closeSheet(); render();
  }

  // ---------- 保存 ----------
  function save(){
    if (!S.editToken){ toast("没有编辑权限，请在手机上开通"); return; }
    var btn = document.getElementById("saveBtn");
    btn.disabled = true; btn.textContent = "保存中…";
    var payload = { name: S.name || elTitle.textContent, courses: S.courses };
    fetch("/api/sched/push?guid=" + encodeURIComponent(S.guid), {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + S.editToken },
      body: JSON.stringify({
        guid: S.guid, op: "upsert", baseRev: S.rev,
        name: S.name || elTitle.textContent, payload: payload
      })
    })
    .then(function(r){ return r.json().then(function(j){ return { code:r.status, j:j }; }); })
    .then(function(o){
      btn.disabled = false; btn.textContent = "保存";
      if (o.code === 409){
        // 云端 rev 被别人推进了：以云端为准刷新，绝不覆盖
        S.rev = o.j.rev || S.rev;
        if (o.j.payload) adopt(o.j.payload);
        toast("手机上也有改动，已刷新到最新版本，请重新调整");
        render();
        return;
      }
      if (o.code === 401){ S.editToken = ""; toast("编辑权限已过期，请在手机上重新开通"); setEditing(false); return; }
      if (o.j.success === false){ toast("保存失败：" + (o.j.error || "未知错误")); return; }
      S.rev = o.j.rev || (S.rev + 1);
      toast("已保存 · 云端 rev " + S.rev);
      setEditing(false);
    })
    .catch(function(){ btn.disabled = false; btn.textContent = "保存"; toast("网络不通，稍后再试"); });
  }

  function adopt(payload){
    var p = payload || {};
    S.name = p.name || S.name;
    S.courses = p.courses || (Array.isArray(p) ? p.slice() : []);
    elTitle.textContent = S.name || "课表";
  }

  // ---------- 交互绑定（与加载解耦，只绑一次） ----------
  // 开始时间定下来后自动补 100 分钟（两节连堂）；结束时间合理就不动
  function endFollowStart(){
    var s = normField(elStart);
    if (!s) return;
    var e = elEnd.value.trim();
    var en = e ? parseTime(e) : "";
    if (!en || toMin(en) <= toMin(s) || elEnd.dataset.auto === "1"){
      setTimeValue(elEnd, addMin(s, 100));
      elEnd.dataset.auto = "1";
    } else elEnd.classList.remove("bad");
    syncQuickActive();
  }
  elStart.addEventListener("blur", endFollowStart);
  elStart.addEventListener("change", endFollowStart);
  elEnd.addEventListener("input", function(){ elEnd.dataset.auto = ""; });
  elEnd.addEventListener("blur", function(){ normField(elEnd); syncQuickActive(); });
  elEnd.addEventListener("change", function(){ normField(elEnd); syncQuickActive(); });
  // 手机键盘会顶起可视区：抽到视图里，别被键盘盖住
  Array.prototype.forEach.call([elStart, elEnd], function(el){
    el.addEventListener("focus", function(){
      setTimeout(function(){ try{ el.scrollIntoView({ block: "center", behavior: "smooth" }); }catch(e){} }, 300);
    });
  });

  Array.prototype.forEach.call(document.querySelectorAll("#quicks .quick"), function(b){
    b.addEventListener("click", function(){
      setTimeValue(elStart, b.getAttribute("data-s"));
      setTimeValue(elEnd, b.getAttribute("data-e"));
      elEnd.dataset.auto = "";
      syncQuickActive();
    });
  });

  // 手机键盘弹出时布局视口不变、可视视口变矮 —— 把抽屉贴到可视区里，别让「确定」被键盘吃掉
  (function(){
    var vv = window.visualViewport;
    var mask = document.getElementById("mask");
    function sync(){
      if (!vv) return;
      mask.style.height = Math.round(vv.height) + "px";
      mask.style.top = Math.round(vv.offsetTop) + "px";
      mask.style.bottom = "auto";
    }
    if (vv){
      vv.addEventListener("resize", sync);
      vv.addEventListener("scroll", sync);
      sync();
    }
  })();
  Array.prototype.forEach.call(document.querySelectorAll("#dayChips .chip"), function(b){
    b.addEventListener("click", function(){ setDayChip(Number(b.getAttribute("data-d"))); });
  });

  document.getElementById("addBtn").addEventListener("click", function(){ openSheet(-1); });
  document.getElementById("saveBtn").addEventListener("click", save);
  document.getElementById("cancelBtn").addEventListener("click", closeSheet);
  document.getElementById("okBtn").addEventListener("click", submitSheet);
  document.getElementById("delBtn").addEventListener("click", deleteCurrent);
  document.getElementById("mask").addEventListener("click", function(ev){
    if (ev.target === this) closeSheet();
  });
  document.addEventListener("keydown", function(ev){
    if (ev.key === "Escape") closeSheet();
  });

  // ---------- 加载 ----------
  var p = parse();
  if (!p.code && !p.guid){ fail("链接不完整", "请从手机 App 的「网页大屏编辑」重新获取链接。"); return; }
  if (!p.code && !p.token){ fail("这个链接缺少访问凭据",
      "链接里的 <code>t=</code> 参数不能丢；请从手机 App 重新复制完整网址。"); return; }

  var load = p.code
      ? fetch("/api/sched/open?c=" + encodeURIComponent(p.code) + "&k=" + encodeURIComponent(new URLSearchParams(location.search).get("k") || ""))
      : fetch("/api/sched/pull?guid=" + encodeURIComponent(p.guid), {
          headers: { "Authorization": "Bearer " + p.token }
        });

  load
    .then(function(r){
      if (r.status === 401) throw new Error("unauthorized");
      if (r.status === 404) throw new Error("notfound");
      return r.json();
    })
    .then(function(j){
      if (!j || j.success === false) throw new Error((j && j.error) || "bad_response");
      if (j.exists === false){
        fail("云端还没有这张课表", "可能手机还没上传完，回手机再点一次「网页大屏编辑」试试。");
        return;
      }
      if (j.deleted){
        fail("这张课表已被删除", "如需恢复，请在手机 App 的云端版本里回滚。");
        return;
      }
      S.guid = j.guid || p.guid;
      S.code = p.code;
      S.rev = j.rev || 0;
      adopt(j.payload || {});
      S.editToken = j.editToken || (p.code ? "" : p.token);
      S.editUntil = j.editUntil || null;
      if (S.editToken && !p.code) S.editToken = p.token;   // 旧长链：链接里的 token 即写权限
      render();
      elEdit.style.display = "";
      if (S.editToken){
        elBadge.textContent = "可编辑";
        elEdit.addEventListener("click", function(){ setEditing(!S.editing); });
        if (S.editUntil){
          var d = new Date(S.editUntil);
          if (!isNaN(d.getTime())){
            elFoot.innerHTML = '网页编辑已开启至 ' + d.toLocaleDateString("zh-CN")
              + ' · 到期后自动转只读，手机上可再次开通';
          }
        }
      } else {
        elEdit.classList.add("ghost");
        elEdit.addEventListener("click", function(){
          toast("请在手机上开通：设备页 → 网页大屏编辑 → 允许网页编辑");
        });
      }
    })
    .catch(function(err){
      if (err.message === "unauthorized")       fail("链接无效或已失效", "请从手机 App 重新复制链接（旧链接可能已被撤销）。");
      else if (err.message === "notfound")      fail("链接格式不对", "地址应形如 <code>/e/10位短码</code>。");
      else                                      fail("读取失败", "网络不通或服务暂时不可用，稍后再试。");
    });
})();
</script>
</body>
</html>
