<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ev课程表 · 页面总览（逐页截图档案）</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
:root {
  --bg:#f3f4f8; --surface:#ffffff; --card-bg:#ffffff; --ink:#1a1a2e;
  --muted:#6b7280; --line:#e7e9f0; --accent:#6c63ff;
}
body {
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
  background:var(--bg); color:var(--ink); line-height:1.6; padding-bottom:40px;
}
/* 画框用写死高度而非 aspect-ratio：老 WebView/旧内核不支持 aspect-ratio 会塌成 0 高致图片不可见（192:490 定比） */
.topbar { position:sticky; top:0; z-index:20; background:rgba(255,255,255,0.92); border-bottom:1px solid var(--line); }
.topbar-inner { max-width:1100px; margin:0 auto; padding:14px 20px 8px; display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:8px; }
.t-title { font-size:1.25rem; font-weight:800; }
.t-title small { font-weight:500; color:var(--muted); font-size:.78rem; margin-left:8px; }
.t-meta { display:flex; flex-wrap:wrap; gap:12px; align-items:center; font-size:.78rem; color:var(--muted); }
.chip { background:var(--accent); color:#fff; padding:3px 10px; border-radius:20px; font-weight:700; }
.filterbar { max-width:1100px; margin:0 auto; padding:0 20px 12px; display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
.fbtn { border:1px solid var(--line); background:var(--surface); color:var(--ink); padding:6px 14px; border-radius:20px; font-size:.82rem; cursor:pointer; }
.fbtn.active { background:var(--accent); color:#fff; border-color:var(--accent); }
.fcheck { display:flex; align-items:center; gap:6px; font-size:.82rem; color:var(--muted); margin-left:auto; cursor:pointer; }
.wrap { max-width:1100px; margin:0 auto; padding:18px 20px; }
.group { background:var(--surface); border:1px solid var(--line); border-radius:16px; margin-bottom:16px; overflow:hidden; }
.group-head { display:flex; align-items:center; justify-content:space-between; padding:14px 18px; cursor:pointer; user-select:none; }
.group-head h2 { font-size:1.05rem; font-weight:700; }
.group-head .count { color:var(--muted); font-size:.8rem; }
.group-body { padding:0 18px 18px; }
.card { display:flex; gap:18px; padding:18px 0; border-top:1px solid var(--line); flex-wrap:wrap; }
.card:first-child { border-top:none; }
.device { width:200px; flex:0 0 auto; height:510px; border-radius:100px; background:#0b0b0f; padding:8px; overflow:hidden; }
.device img { width:100%; height:100%; object-fit:cover; border-radius:92px; display:block; cursor:zoom-in; }
.device.empty { display:flex; align-items:center; justify-content:center; text-align:center; color:#9aa; font-size:.8rem; }
.device.empty .ph { padding:10px; }
.shots { display:flex; gap:10px; flex-wrap:wrap; }
.shots .device { width:150px; height:383px; border-radius:78px; padding:6px; }
.shots .device img { border-radius:70px; }
.info { flex:1; min-width:260px; }
.p-name { font-size:1.05rem; font-weight:700; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.badge-premium { background:#b8860b; color:#fff; font-size:.7rem; padding:2px 8px; border-radius:12px; font-weight:700; }
.badge-issue { background:#e53935; color:#fff; font-size:.7rem; padding:2px 8px; border-radius:12px; font-weight:700; }
.badge-pending { background:#f0a000; color:#fff; font-size:.7rem; padding:2px 8px; border-radius:12px; font-weight:700; }
.row { margin-top:8px; font-size:.88rem; }
.row .k { color:var(--muted); font-weight:600; margin-right:4px; }
.pts { margin-top:6px; padding-left:18px; font-size:.86rem; color:#444; }
.pts li { margin-bottom:2px; }
.checklist { margin-top:8px; font-size:.82rem; }
.checklist div { margin-bottom:2px; }
.ok { color:#2e7d32; } .err { color:#e53935; font-weight:600; } .pend { color:#f0a000; }
.meta { margin-top:8px; font-size:.76rem; color:var(--muted); border-top:1px dashed var(--line); padding-top:6px; }
.footer { text-align:center; color:var(--muted); font-size:.8rem; padding:24px 20px; line-height:1.8; }
.lightbox { position:fixed; inset:0; background:rgba(0,0,0,0.85); display:none; align-items:center; justify-content:center; z-index:50; cursor:zoom-out; }
.lightbox.show { display:flex; }
.lightbox img { max-width:90vw; max-height:90vh; border-radius:24px; }
/* ===== 审核结果交互 ===== */
.shot-unit { display:flex; flex-direction:column; align-items:center; }
.review-bar { display:flex; gap:4px; margin-top:6px; flex-wrap:wrap; justify-content:center; }
.rv-btn { border:1px solid var(--line); background:var(--surface); color:var(--ink); padding:3px 10px; border-radius:12px; font-size:.72rem; cursor:pointer; }
.rv-btn:hover { border-color:var(--accent); color:var(--accent); }
.rv-btn.rv-del:hover { border-color:#e53935; color:#e53935; }
.rv-btn.rv-ok { border-color:#2e7d32; color:#2e7d32; }
.rv-btn.rv-warn { border-color:#f0a000; color:#f0a000; }
.device { position:relative; }
.anno-layer { position:absolute; inset:0; z-index:5; cursor:crosshair; background:rgba(0,0,0,0.08); }
.anno-box { position:absolute; border:2px solid #ff3b30; background:rgba(255,59,48,0.15); pointer-events:none; }
.rv-flag { outline:3px solid #ff3b30; outline-offset:-3px; }
.rv-flag-resolved { outline:3px solid #2e7d32; outline-offset:-3px; }
.rv-flag-deleted { opacity:0.35; }
.review-panel { width:100%; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:8px; margin-top:6px; text-align:left; }
.rv-chips { display:flex; flex-wrap:wrap; gap:4px; margin-bottom:6px; }
.rv-chip { border:1px solid var(--line); background:var(--surface); color:var(--muted); padding:2px 9px; border-radius:12px; font-size:.72rem; cursor:pointer; }
.rv-chip.on { background:var(--accent); border-color:var(--accent); color:#fff; }
.rv-boxinfo { font-size:.7rem; color:var(--muted); margin-bottom:5px; }
.rv-note { width:100%; border:1px solid var(--line); border-radius:8px; padding:5px 8px; font-size:.78rem; box-sizing:border-box; margin-bottom:6px; }
.rv-actions { display:flex; gap:6px; }
.rv-actions .rv-btn { flex:1; }
.rv-msg { font-size:.7rem; color:var(--muted); margin-top:4px; min-height:1em; }
.rv-nick { width:40%; border:1px solid var(--line); border-radius:8px; padding:5px 8px; font-size:.78rem; box-sizing:border-box; margin-bottom:6px; margin-right:4%; }
.rv-history { width:100%; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:8px; margin-top:6px; text-align:left; }
.rv-h-head { display:flex; justify-content:space-between; align-items:center; font-size:.72rem; color:var(--muted); margin-bottom:6px; }
.rv-h-status.ok { color:#2e7d32; font-weight:700; }
.rv-h-status.warn { color:#f0a000; font-weight:700; }
.rv-h-item { border-top:1px dashed var(--line); padding:5px 0; font-size:.74rem; }
.rv-h-empty { font-size:.74rem; color:var(--muted); }
.rv-h-line1 { display:flex; gap:8px; align-items:center; }
.rv-h-tag { background:var(--accent); color:#fff; padding:1px 8px; border-radius:10px; font-size:.68rem; }
.rv-h-line2 { color:#444; margin-top:2px; }
@media (max-width:600px){ .device{width:160px;height:408px;} .shots .device{width:120px;height:306px;} }
</style>
</head>

var currentGroup = '';
var onlyIssue = false;

function issueLevel(v){
  if(!v) return null;
  if(v.indexOf('❌') >= 0 || v.indexOf('待修') >= 0) return 'err';
  if(v.indexOf('待') >= 0) return 'pend';
  return 'ok';
}
function hasIssuePage(p){
  var c = p.check || {}; var ks = Object.keys(c);
  for(var i=0;i<ks.length;i++){ if(issueLevel(c[ks[i]])==='err') return true; }
  return false;
}
function renderShots(p){
  var shots = p.shots;
  if(!shots || !shots.length){
    return '<div class="shots"><div class="device empty"><div class="ph">待采集<br><span style="font-size:.72rem">尚无截图</span></div></div></div>';
  }
  var html = '<div class="shots">';
  for(var i=0;i<shots.length;i++){
    var s = shots[i];
    html += '<div class="shot-unit" data-page="'+p.id+'" data-file="'+s.file+'">'
         +  '<div class="device" onclick="openLightbox(this)"><img loading="lazy" src="/images/ev-schedule/'+s.file+'" alt="'+s.state+'" onerror="imgError(this)"></div>'
         +  '<div class="review-bar">'
         +  '<button class="rv-btn" onclick="toggleReview(this, event)">审核</button>'
         +  '<button class="rv-btn" onclick="quickMark(this, \'recapture\', event)">换最新版</button>'
         +  '<button class="rv-btn rv-del" onclick="quickMark(this, \'delete\', event)">删除</button>'
         +  '<button class="rv-btn" onclick="toggleHistory(this, event)">记录</button>'
         +  '</div>'
         +  '<div class="rv-history" style="display:none"></div>'
         +  '</div>';
  }
  return html + '</div>';
}
function renderCheck(check){
  var keys = Object.keys(check); if(!keys.length) return '';
  var html = '<div class="checklist">';
  for(var i=0;i<keys.length;i++){
    var k = keys[i]; var v = check[k]; var lv = issueLevel(v);
    var cls = lv==='err' ? 'err' : (lv==='pend' ? 'pend' : 'ok');
    var mark = lv==='err' ? '❌' : (lv==='pend' ? '⚠️' : '✅');
    html += '<div class="'+cls+'">'+mark+' '+k+'：'+v+'</div>';
  }
  return html + '</div>';
}
function renderMeta(shots, why){
  if(!shots || !shots.length){
    return '<div class="meta">未采集'+(why ? ' · '+why : '')+'</div>';
  }
  var html = '<div class="meta">截图记录：<br>';
  for(var i=0;i<shots.length;i++){
    var s = shots[i];
    html += '· '+s.state+' <b>v'+s.version+'</b> · '+s.at+'<br>';
  }
  return html + '</div>';
}
function renderCard(p){
  var card = document.createElement('div');
  card.className = 'card';
  card.setAttribute('data-group', p.group);
  if(hasIssuePage(p)) card.setAttribute('data-issue', '1');
  var left = document.createElement('div');
  left.innerHTML = renderShots(p);
  var info = document.createElement('div');
  info.className = 'info';
  var badges = '';
  if(p.premium) badges += '<span class="badge-premium">高级版</span>';
  if(hasIssuePage(p)) badges += '<span class="badge-issue">已知问题</span>';
  var html = '<div class="p-name">'+p.name+badges+'</div>';
  if(p.usage) html += '<div class="row"><span class="k">用途</span>'+p.usage+'</div>';
  if(p.entry) html += '<div class="row"><span class="k">入口</span>'+p.entry+'</div>';
  if(p.points && p.points.length) html += '<div class="pts"><li>'+p.points.join('</li><li>')+'</li></div>';
  if(p.premiumNote) html += '<div class="row" style="color:#b8860b">🔒 '+p.premiumNote+'</div>';
  html += renderCheck(p.check);
  html += renderMeta(p.shots, p.why);
  info.innerHTML = html;
  card.appendChild(left); card.appendChild(info);
  return card;
}
function renderGroup(name, pages){
  var g = document.createElement('div');
  g.className = 'group'; g.setAttribute('data-group', name);
  var head = document.createElement('div');
  head.className = 'group-head';
  head.innerHTML = '<h2>'+name+'</h2><span class="count">'+pages.length+' 页</span>';
  head.setAttribute('onclick', "toggleGroup('"+name+"')");
  var body = document.createElement('div');
  body.className = 'group-body'; body.id = 'gb-'+name;
  for(var i=0;i<pages.length;i++){ body.appendChild(renderCard(pages[i])); }
  g.appendChild(head); g.appendChild(body);
  return g;
}
function uniqueGroups(){
  var seen = {}; var arr = [];
  for(var i=0;i<DATA.pages.length;i++){ var g = DATA.pages[i].group; if(!seen[g]){ seen[g]=1; arr.push(g); } }
  return arr;
}
function toggleGroup(name){
  var b = document.getElementById('gb-'+name);
  b.style.display = (b.style.display === 'none') ? 'block' : 'none';
}
function setGroup(name){ currentGroup = name; applyFilter(); }
function applyFilter(){
  var groups = document.getElementsByClassName('group');
  for(var i=0;i<groups.length;i++){
    var g = groups[i]; var cards = g.getElementsByClassName('card'); var anyVisible = false;
    for(var j=0;j<cards.length;j++){
      var c = cards[j]; var show = true;
      if(currentGroup && c.getAttribute('data-group') !== currentGroup) show = false;
      if(onlyIssue && c.getAttribute('data-issue') !== '1') show = false;
      c.style.display = show ? 'flex' : 'none';
      if(show) anyVisible = true;
    }
    g.style.display = anyVisible ? 'block' : 'none';
  }
  var btns = document.getElementsByClassName('fbtn');
  for(var k=0;k<btns.length;k++){ btns[k].className = 'fbtn' + (btns[k].getAttribute('data-g') === currentGroup ? ' active' : ''); }
}
function buildFilter(){
  var bar = document.getElementById('filterbar');
  var all = document.createElement('button');
  all.className = 'fbtn active'; all.setAttribute('data-g', ''); all.textContent = '全部';
  all.setAttribute('onclick', "setGroup('')");
  bar.appendChild(all);
  var groups = uniqueGroups();
  for(var i=0;i<groups.length;i++){
    var b = document.createElement('button');
    b.className = 'fbtn'; b.setAttribute('data-g', groups[i]); b.textContent = groups[i];
    b.setAttribute('onclick', "setGroup('"+groups[i]+"')");
    bar.appendChild(b);
  }
  var lbl = document.createElement('label');
  lbl.className = 'fcheck';
  lbl.innerHTML = '<input type="checkbox" id="onlyIssue" onchange="onlyIssue=this.checked;applyFilter();"> 只看有问题的';
  bar.appendChild(lbl);
}
function imgError(img){
  var d = img.parentNode;
  if(d){ d.className = 'device empty'; d.innerHTML = '<div class="ph">截图缺失</div>'; }
}
function openLightbox(el){
  var img = el.getElementsByTagName('img')[0];
  document.getElementById('lightboxImg').src = img ? img.src : '';
  document.getElementById('lightbox').className = 'lightbox show';
}
function hideLightbox(){ document.getElementById('lightbox').className = 'lightbox'; }
function render(){
  document.getElementById('verChip').textContent = 'v'+DATA.watchApp.version+' ('+DATA.watchApp.versionCode+')';
  document.getElementById('capTime').textContent = DATA.capturedAt || DATA.pageUpdatedAt;
  document.getElementById('pageTime').textContent = DATA.pageUpdatedAt;
  buildFilter();
  var groups = uniqueGroups();
  var app = document.getElementById('app');
  var byGroup = {};
  for(var i=0;i<DATA.pages.length;i++){ var g = DATA.pages[i].group; (byGroup[g] = byGroup[g] || []).push(DATA.pages[i]); }
  for(var j=0;j<groups.length;j++){ app.appendChild(renderGroup(groups[j], byGroup[groups[j]])); }
}
render();

/* ===== 审核结果交互（对接 /api/admin/review）===== */
var RV_ISSUES = ["文字遮挡","文字省略","标题显示不全","布局错位","按钮过小","越界裁切","对齐偏移","颜色对比","其他"];
var RV_API = "/api/admin/review";
var RV_ITEMS = [];  // 全量审核数据（含历史），由 fetchReviewBadges 拉取
var RV_ACTION_CN = { fix:"待修", recapture:"待重采", delete:"已删除", resolved:"已修复" };

// 昵称：按 IP/浏览器 生成随机昵称，localStorage 记住；允许修改
function rvNick(){
  var n = "";
  try { n = localStorage.getItem("rv_nick") || ""; } catch(e){}
  if(!n){
    var pool = ["图虫","快门","像素","描边","像素眼","挑刺儿","找茬","校对"];
    n = pool[Math.floor(Math.random()*pool.length)] + "-" + Math.floor(1000+Math.random()*9000);
    try { localStorage.setItem("rv_nick", n); } catch(e){}
  }
  return n;
}
function rvSaveNick(v){
  var n = String(v||"").trim().slice(0,24);
  if(!n) return rvNick();
  try { localStorage.setItem("rv_nick", n); } catch(e){}
  return n;
}
function fmtTs(ts){
  if(!ts) return "";
  var d = new Date(ts);
  var p = function(x){ return (x<10?"0":"")+x; };
  return (d.getMonth()+1)+"-"+p(d.getDate())+" "+p(d.getHours())+":"+p(d.getMinutes());
}

function toggleReview(btn, e){
  if(e) e.stopPropagation();
  var unit = btn.closest(".shot-unit");
  var panel = unit.querySelector(".review-panel");
  if(!panel){
    panel = document.createElement("div");
    panel.className = "review-panel";
    var chips = "";
    for(var i=0;i<RV_ISSUES.length;i++){
      chips += '<button class="rv-chip" onclick="rvToggleChip(this, event)">'+RV_ISSUES[i]+'</button>';
    }
    panel.innerHTML = '<div class="rv-chips">'+chips+'</div>'
      + '<div class="rv-boxinfo">在截图上按住拖框圈出问题区域（可多处框选）</div>'
      + '<input class="rv-nick" value="'+rvNick()+'" placeholder="昵称">'
      + '<input class="rv-note" placeholder="快速批注（可选）">'
      + '<div class="rv-actions">'
      + '<button class="rv-btn" onclick="submitReview(this, \'fix\', event)">提交审核</button>'
      + '<button class="rv-btn rv-ok" onclick="submitReview(this, \'resolved\', event)">已修复</button>'
      + '</div><div class="rv-msg"></div>';
    unit.appendChild(panel);
    enableAnno(unit);
  }
  var show = panel.style.display === "none";
  panel.style.display = show ? "block" : "none";
}

function rvToggleChip(chip, e){
  if(e) e.stopPropagation();
  chip.classList.toggle("on");
}

function enableAnno(unit){
  var device = unit.querySelector(".device");
  var img = device.querySelector("img");
  var layer = document.createElement("div");
  layer.className = "anno-layer";
  device.appendChild(layer);
  var box = null, sx = 0, sy = 0, dragging = false;

  function pt(e){
    var ir = img.getBoundingClientRect();
    var cx = Math.max(0, Math.min(ir.width, e.clientX - ir.left));
    var cy = Math.max(0, Math.min(ir.height, e.clientY - ir.top));
    return { x: cx, y: cy, ir: ir };
  }
  // 多框：每次拖框新建一个框，互不影响；双击某框可删除该框
  layer.addEventListener("pointerdown", function(e){
    e.stopPropagation(); e.preventDefault();
    dragging = true; var p = pt(e); sx = p.x; sy = p.y;
    box = document.createElement("div"); box.className = "anno-box"; layer.appendChild(box);
    box.style.left = sx+"px"; box.style.top = sy+"px";
    box.style.width = "0px"; box.style.height = "0px";
    box.addEventListener("dblclick", function(ev){ ev.stopPropagation(); box.remove(); box = null; updateBoxInfo(unit); });
  });
  layer.addEventListener("pointermove", function(e){
    if(!dragging || !box) return;
    e.preventDefault();
    var p = pt(e);
    box.style.left = Math.min(sx, p.x)+"px";
    box.style.top = Math.min(sy, p.y)+"px";
    box.style.width = Math.abs(p.x-sx)+"px";
    box.style.height = Math.abs(p.y-sy)+"px";
  });
  layer.addEventListener("pointerup", function(e){
    dragging = false;
    updateBoxInfo(unit);
  });
  // 吃掉 click，避免拖框/点击时触发外层 lightbox（图片放大弹层）
  layer.addEventListener("click", function(e){ e.stopPropagation(); });
}

// 框（显示坐标）→ 原始图像素归一化：处理 object-fit:cover 裁剪；支持多框
function collectBoxesNorm(unit){
  var img = unit.querySelector("img");
  var layer = unit.querySelector(".anno-layer");
  if(!layer || !img) return [];
  var ir = img.getBoundingClientRect();
  var iw = img.naturalWidth || 192, ih = img.naturalHeight || 490;
  var scale = Math.max(ir.width/iw, ir.height/ih);
  var dispW = iw*scale, dispH = ih*scale;
  var offX = (ir.width - dispW)/2, offY = (ir.height - dispH)/2;
  function c01(v, max){ return Math.max(0, Math.min(1, Math.round(v/max*1000)/1000)); }
  var out = [];
  var boxes = layer.querySelectorAll(".anno-box");
  for(var i=0;i<boxes.length;i++){
    var br = boxes[i].getBoundingClientRect();
    var ox = (br.left - ir.left - offX)/scale;
    var oy = (br.top - ir.top - offY)/scale;
    var ow = br.width/scale, oh = br.height/scale;
    if(ow <= 2 || oh <= 2) continue;
    out.push({ x: c01(ox, iw), y: c01(oy, ih), w: c01(ow, iw), h: c01(oh, ih) });
  }
  return out;
}

function updateBoxInfo(unit){
  var info = unit.querySelector(".rv-boxinfo");
  if(!info) return;
  var n = collectBoxesNorm(unit).length;
  info.textContent = n > 0
    ? ("已框选 "+n+" 处（继续拖框可多处标注，双击某框可删除该框）")
    : "在截图上按住拖框圈出问题区域（可多处框选，可不框）";
}

function collectChips(unit){
  var out = [];
  var chips = unit.querySelectorAll(".rv-chip.on");
  for(var i=0;i<chips.length;i++) out.push(chips[i].textContent);
  return out;
}

function postReview(payload, cb){
  fetch(RV_API, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload)
  }).then(function(r){ return r.json(); }).then(function(d){
    cb(d && d.success, d);
  }).catch(function(){ cb(false, { error: "网络错误" }); });
}

function submitReview(btn, action, e){
  if(e) e.stopPropagation();
  var unit = btn.closest(".shot-unit");
  var msg = unit.querySelector(".rv-msg");
  var payload = {
    pageId: unit.getAttribute("data-page"),
    shotFile: unit.getAttribute("data-file"),
    issues: collectChips(unit),
    boxes: collectBoxesNorm(unit),
    note: (unit.querySelector(".rv-note") || {}).value || "",
    action: action,
    reviewer: "用户",
    nickname: rvSaveNick((unit.querySelector(".rv-nick") || {}).value)
  };
  if(!payload.issues.length && !payload.boxes.length && !payload.note && action === "fix"){
    msg.textContent = "请先框选区域 / 勾选问题 / 填写批注";
    return;
  }
  msg.textContent = "提交中…";
  postReview(payload, function(okRes, d){
    msg.textContent = okRes ? "✅ 已提交（action=" + action + "）" : "❌ " + (d && d.error || "提交失败");
    if(okRes){
      applyFlag(unit, action);
      if(action === "fix"){
        var layer = unit.querySelector(".anno-layer");
        if(layer){
          var boxes = layer.querySelectorAll(".anno-box");
          for(var i=boxes.length-1;i>=0;i--) boxes[i].remove();
        }
        updateBoxInfo(unit);
      }
    }
  });
}

// 快捷标记：再点一次同一标记 = 撤销（恢复为待修 fix）
function quickMark(btn, action, e){
  if(e) e.stopPropagation();
  var unit = btn.closest(".shot-unit");
  var cur = unit.getAttribute("data-action") || "";
  var undoing = (cur === action);
  var payload = {
    pageId: unit.getAttribute("data-page"),
    shotFile: unit.getAttribute("data-file"),
    issues: [], boxes: [], note: undoing ? "撤销标记" : "",
    action: undoing ? "fix" : action, reviewer: "用户",
    nickname: rvNick()
  };
  postReview(payload, function(okRes, d){
    if(!okRes){ btn.textContent = "失败"; return; }
    if(undoing){
      unit.removeAttribute("data-action");
      applyFlag(unit, "none");
      applyBtnState(unit, "");
    } else {
      unit.setAttribute("data-action", action);
      applyFlag(unit, action);
      applyBtnState(unit, action);
    }
  });
}

// 标记按钮状态：被标记的那个按钮高亮显示"点撤销"
function applyBtnState(unit, action){
  var bar = unit.querySelector(".review-bar");
  if(!bar) return;
  var btns = bar.querySelectorAll(".rv-btn");
  for(var i=0;i<btns.length;i++){
    var b = btns[i];
    if(b.classList.contains("rv-ok") || b.classList.contains("rv-warn")){
      b.classList.remove("rv-ok", "rv-warn");
      b.textContent = b.getAttribute("data-label") || b.textContent;
    }
  }
  if(action === "recapture" || action === "delete"){
    var target = null;
    for(var j=0;j<btns.length;j++){
      var onclick = btns[j].getAttribute("onclick") || "";
      if(onclick.indexOf("'"+action+"'") !== -1) target = btns[j];
    }
    if(target){
      target.setAttribute("data-label", target.textContent);
      target.textContent = action === "delete" ? "已标记删除(点撤销)" : "已标记换版(点撤销)";
      target.classList.add(action === "delete" ? "rv-del" : "rv-warn");
    }
  }
}

function applyFlag(unit, action){
  var device = unit.querySelector(".device");
  device.classList.remove("rv-flag", "rv-flag-resolved", "rv-flag-deleted");
  if(action === "fix" || action === "recapture") device.classList.add("rv-flag");
  else if(action === "resolved") device.classList.add("rv-flag-resolved");
  else if(action === "delete") device.classList.add("rv-flag-deleted");
}

// 页面加载后拉取全部审核结果：回填角标 + 更新「记录(n)」按钮状态
fetch(RV_API).then(function(r){ return r.json(); }).then(function(d){
  if(!d || !d.success || !d.items) return;
  RV_ITEMS = d.items;
  var byKey = {};
  d.items.forEach(function(it){ byKey[it.pageId + "|" + it.shotFile] = it; });
  var units = document.querySelectorAll(".shot-unit");
  for(var i=0;i<units.length;i++){
    var u = units[i];
    var key = u.getAttribute("data-page") + "|" + u.getAttribute("data-file");
    var it = byKey[key];
    var hbtn = u.querySelector('[onclick*="toggleHistory"]');
    if(!it) continue;
    applyFlag(u, it.action);
    if(hbtn){
      hbtn.textContent = "记录(" + it.count + ")";
      if(it.status === "done") hbtn.classList.add("rv-ok");
      else hbtn.classList.add("rv-warn");
    }
  }
}).catch(function(){});

// 历史记录折叠区：列出该截图全部提交（次数/昵称/问题/状态）
function toggleHistory(btn, e){
  if(e) e.stopPropagation();
  var unit = btn.closest(".shot-unit");
  var box = unit.querySelector(".rv-history");
  if(!box) return;
  if(box.style.display === "block"){ box.style.display = "none"; return; }
  var key = unit.getAttribute("data-page") + "|" + unit.getAttribute("data-file");
  var it = null;
  for(var i=0;i<RV_ITEMS.length;i++){
    if(RV_ITEMS[i].pageId + "|" + RV_ITEMS[i].shotFile === key){ it = RV_ITEMS[i]; break; }
  }
  if(!it){ box.innerHTML = '<div class="rv-h-empty">暂无提交记录</div>'; box.style.display="block"; return; }
  var rows = '<div class="rv-h-head">'
    + '<span class="rv-h-status '+(it.status==="done"?"ok":"warn")+'">'+(it.status==="done"?"✅ 已全部处理":"⏳ 待处理")+'</span>'
    + '<span>提交 '+it.count+' 次 · 最近 '+fmtTs(it.updated_at)+'</span>'
    + '</div>';
  var hist = (it.history || []).slice();
  hist.unshift({ action: it.action, issues: it.issues, note: it.note, nickname: it.nickname, reviewer: it.reviewer, at: it.updated_at });
  for(var j=0;j<hist.length;j++){
    var h = hist[j];
    var iss = (h.issues||[]).join("、");
    var who = h.nickname || h.reviewer || "匿名";
    rows += '<div class="rv-h-item">'
      + '<div class="rv-h-line1"><b>'+fmtTs(h.at)+'</b><span>· '+who+'</span>'
      + '<span class="rv-h-tag">'+(RV_ACTION_CN[h.action]||h.action)+'</span></div>'
      + (iss ? '<div class="rv-h-line2">问题：'+iss+'</div>' : '')
      + (h.note ? '<div class="rv-h-line2">批注：'+h.note+'</div>' : '')
      + '</div>';
  }
  box.innerHTML = rows;
  box.style.display = "block";
}
