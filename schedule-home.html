<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>日程管理 - 首页</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    min-height: 100vh;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    padding: 20px;
  }

  /* 模拟手环设备外壳 */
  .device {
    width: 220px;
    height: 490px;
    background: #0a0a0a;
    border-radius: 60px;
    padding: 18px 12px;
    box-shadow:
      0 0 0 3px #2a2a2a,
      0 25px 60px rgba(0,0,0,0.6),
      inset 0 0 30px rgba(255,255,255,0.03);
    position: relative;
  }

  .device::before {
    content: "";
    position: absolute;
    top: 8px; left: 50%;
    transform: translateX(-50%);
    width: 40px; height: 4px;
    background: #1a1a1a;
    border-radius: 2px;
  }

  .screen {
    width: 100%;
    height: 100%;
    background: linear-gradient(180deg, #0d1117 0%, #151b26 100%);
    border-radius: 44px;
    overflow: hidden;
    position: relative;
    display: flex;
    flex-direction: column;
  }

  /* 顶部状态栏 */
  .status-bar {
    padding: 14px 18px 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: #8b949e;
    font-size: 10px;
    font-weight: 500;
  }
  .status-bar .time { color: #e6edf3; font-size: 11px; font-weight: 600; }
  .status-bar .icons { display: flex; gap: 4px; align-items: center; }
  .battery {
    width: 18px; height: 8px;
    border: 0.5px solid #8b949e;
    border-radius: 2px;
    position: relative;
    padding: 1px;
  }
  .battery::after {
    content: "";
    position: absolute;
    right: -2px; top: 2px;
    width: 1.5px; height: 3px;
    background: #8b949e;
    border-radius: 0 1px 1px 0;
  }
  .battery-level {
    width: 80%; height: 100%;
    background: linear-gradient(90deg, #ff6b35, #ffa535);
    border-radius: 1px;
  }
  .heart { color: #ff4757; font-size: 9px; }

  /* 日期头部 */
  .header {
    padding: 10px 18px 14px;
    position: relative;
  }
  .header::after {
    content: "";
    position: absolute;
    bottom: 0; left: 18px; right: 18px;
    height: 0.5px;
    background: linear-gradient(90deg, transparent, rgba(255,165,53,0.3), transparent);
  }
  .date-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
  }
  .date-main .day-num {
    font-size: 32px;
    font-weight: 700;
    color: #e6edf3;
    line-height: 1;
    letter-spacing: -1px;
  }
  .date-main .day-week {
    font-size: 11px;
    color: #ffa535;
    margin-top: 4px;
    font-weight: 500;
  }
  .month-info {
    text-align: right;
    font-size: 10px;
    color: #8b949e;
  }
  .month-info .month { color: #e6edf3; font-size: 13px; font-weight: 600; }
  .summary-badge {
    margin-top: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
    background: linear-gradient(90deg, rgba(255,107,53,0.15), rgba(255,165,53,0.05));
    border: 0.5px solid rgba(255,107,53,0.3);
    padding: 8px 10px;
    border-radius: 12px;
  }
  .badge-icon {
    width: 20px; height: 20px;
    background: linear-gradient(135deg, #ff6b35, #ffa535);
    border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px;
    box-shadow: 0 2px 8px rgba(255,107,53,0.4);
  }
  .badge-text { font-size: 10px; color: #e6edf3; }
  .badge-text strong { color: #ffa535; font-size: 12px; }

  /* 日程列表 */
  .schedule-list {
    flex: 1;
    overflow-y: auto;
    padding: 10px 14px 80px;
    scrollbar-width: none;
  }
  .schedule-list::-webkit-scrollbar { display: none; }

  .section-title {
    font-size: 9px;
    color: #8b949e;
    padding: 8px 4px 6px;
    letter-spacing: 0.5px;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .section-title .dot { width: 3px; height: 3px; border-radius: 50%; }
  .dot-today { background: #ff6b35; box-shadow: 0 0 4px #ff6b35; }
  .dot-tomorrow { background: #3b82f6; }

  .schedule-card {
    background: rgba(255,255,255,0.03);
    border: 0.5px solid rgba(255,255,255,0.06);
    border-radius: 14px;
    padding: 10px 12px;
    margin-bottom: 8px;
    display: flex;
    align-items: flex-start;
    gap: 10px;
    position: relative;
    overflow: hidden;
    transition: transform 0.15s;
  }
  .schedule-card:active { transform: scale(0.97); }

  .card-bar {
    width: 3px;
    min-height: 100%;
    border-radius: 2px;
    position: absolute;
    left: 0; top: 0; bottom: 0;
  }
  .bar-work { background: linear-gradient(180deg, #3b82f6, #60a5fa); }
  .bar-personal { background: linear-gradient(180deg, #ff6b35, #ffa535); }
  .bar-health { background: linear-gradient(180deg, #10b981, #34d399); }
  .bar-reminder { background: linear-gradient(180deg, #a855f7, #c084fc); }

  .card-time {
    min-width: 42px;
    padding-top: 1px;
  }
  .card-time .time-hour {
    font-size: 12px;
    font-weight: 700;
    color: #e6edf3;
    line-height: 1;
  }
  .card-time .time-min {
    font-size: 9px;
    color: #8b949e;
    margin-top: 1px;
  }

  .card-content { flex: 1; min-width: 0; }
  .card-title {
    font-size: 12px;
    font-weight: 600;
    color: #e6edf3;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    line-height: 1.3;
  }
  .card-desc {
    font-size: 9px;
    color: #6e7681;
    margin-top: 3px;
    line-height: 1.4;
    display: -webkit-box;
    -webkit-line-clamp: 1;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .card-tags {
    display: flex;
    gap: 4px;
    margin-top: 5px;
    flex-wrap: wrap;
  }
  .tag {
    font-size: 8px;
    padding: 2px 5px;
    border-radius: 4px;
    font-weight: 500;
  }
  .tag-remind { background: rgba(255,107,53,0.2); color: #ffa535; }
  .tag-loc { background: rgba(59,130,246,0.2); color: #60a5fa; }
  .tag-done { background: rgba(16,185,129,0.2); color: #34d399; }

  .card-status {
    width: 16px; height: 16px;
    border-radius: 50%;
    border: 1.5px solid #30363d;
    flex-shrink: 0;
    margin-top: 2px;
    display: flex; align-items: center; justify-content: center;
  }
  .status-done {
    background: linear-gradient(135deg, #10b981, #34d399);
    border-color: transparent;
  }
  .status-done::after {
    content: "✓";
    color: #fff;
    font-size: 8px;
    font-weight: 700;
  }

  /* 底部浮动按钮 */
  .fab-container {
    position: absolute;
    bottom: 20px; left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 12px;
    align-items: center;
    padding: 6px 10px;
    background: rgba(13, 17, 23, 0.85);
    backdrop-filter: blur(10px);
    border: 0.5px solid rgba(255,165,53,0.2);
    border-radius: 30px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  }
  .icon-btn {
    width: 32px; height: 32px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px;
    color: #8b949e;
    transition: all 0.15s;
  }
  .icon-btn:active { transform: scale(0.9); }
  .icon-btn.active {
    background: linear-gradient(135deg, #ff6b35, #ffa535);
    color: #fff;
    box-shadow: 0 4px 12px rgba(255,107,53,0.4);
  }
  .divider-v {
    width: 0.5px; height: 20px;
    background: rgba(255,255,255,0.1);
  }
  .add-btn {
    width: 32px; height: 32px;
    border-radius: 50%;
    background: linear-gradient(135deg, #ff6b35, #f97316);
    display: flex; align-items: center; justify-content: center;
    color: #fff;
    font-size: 18px;
    font-weight: 300;
    box-shadow: 0 4px 16px rgba(255,107,53,0.5);
    transition: all 0.15s;
  }
  .add-btn:active { transform: scale(0.9) rotate(90deg); }
</style>
</head>
<body>

<div class="device">
  <div class="screen">
    <!-- 状态栏 -->
    <div class="status-bar">
      <span class="time">09:41</span>
      <div class="icons">
        <span class="heart">♥</span>
        <span>🔔</span>
        <div class="battery"><div class="battery-level"></div></div>
      </div>
    </div>

    <!-- 日期头部 -->
    <div class="header">
      <div class="date-row">
        <div class="date-main">
          <div class="day-num">18</div>
          <div class="day-week">星期三</div>
        </div>
        <div class="month-info">
          <div class="month">9月</div>
          <div>2026</div>
        </div>
      </div>
      <div class="summary-badge">
        <div class="badge-icon">📋</div>
        <div class="badge-text">今日 <strong>4</strong> 项日程 · 1 项待完成</div>
      </div>
    </div>

    <!-- 日程列表 -->
    <div class="schedule-list">
      <div class="section-title"><span class="dot dot-today"></span>今天 · 进行中</div>

      <div class="schedule-card">
        <div class="card-bar bar-health"></div>
        <div class="card-time">
          <div class="time-hour">08:30</div>
          <div class="time-min">30分</div>
        </div>
        <div class="card-content">
          <div class="card-title">晨跑打卡</div>
          <div class="card-desc">公园3公里 · 配速5'30"</div>
          <div class="card-tags">
            <span class="tag tag-done">已完成</span>
          </div>
        </div>
        <div class="card-status status-done"></div>
      </div>

      <div class="schedule-card">
        <div class="card-bar bar-work"></div>
        <div class="card-time">
          <div class="time-hour">10:00</div>
          <div class="time-min">60分</div>
        </div>
        <div class="card-content">
          <div class="card-title">产品评审会议</div>
          <div class="card-desc">会议室A302 · 周会</div>
          <div class="card-tags">
            <span class="tag tag-loc">📍 A302</span>
            <span class="tag tag-remind">⏰ 提前10分</span>
          </div>
        </div>
        <div class="card-status"></div>
      </div>

      <div class="section-title"><span class="dot dot-tomorrow"></span>即将开始</div>

      <div class="schedule-card">
        <div class="card-bar bar-personal"></div>
        <div class="card-time">
          <div class="time-hour">14:30</div>
          <div class="time-min">90分</div>
        </div>
        <div class="card-content">
          <div class="card-title">牙医预约</div>
          <div class="card-desc">口腔医院 · 洁牙复查</div>
          <div class="card-tags">
            <span class="tag tag-remind">⏰ 提前30分</span>
            <span class="tag tag-loc">📍 医院</span>
          </div>
        </div>
        <div class="card-status"></div>
      </div>

      <div class="schedule-card">
        <div class="card-bar bar-reminder"></div>
        <div class="card-time">
          <div class="time-hour">19:00</div>
          <div class="time-min">提醒</div>
        </div>
        <div class="card-content">
          <div class="card-title">给妈妈打电话</div>
          <div class="card-desc">每周三固定问候</div>
          <div class="card-tags">
            <span class="tag tag-remind">⏰ 准时</span>
          </div>
        </div>
        <div class="card-status"></div>
      </div>

      <div class="section-title" style="margin-top:8px;"><span class="dot dot-tomorrow"></span>明天 · 19日 星期四</div>

      <div class="schedule-card">
        <div class="card-bar bar-work"></div>
        <div class="card-time">
          <div class="time-hour">09:00</div>
          <div class="time-min">全天</div>
        </div>
        <div class="card-content">
          <div class="card-title">季度汇报PPT提交</div>
          <div class="card-desc">截止日期 · Q3业绩总结</div>
          <div class="card-tags">
            <span class="tag tag-remind">⏰ 重要</span>
          </div>
        </div>
        <div class="card-status"></div>
      </div>
    </div>

    <!-- 底部导航 -->
    <div class="fab-container">
      <div class="icon-btn active">📅</div>
      <div class="divider-v"></div>
      <div class="icon-btn">🕐</div>
      <div class="divider-v"></div>
      <div class="icon-btn">🗂</div>
      <div class="divider-v"></div>
      <div class="add-btn">+</div>
    </div>
  </div>
</div>

<script>
  // 交互：点击卡片
  document.querySelectorAll('.schedule-card').forEach(card => {
    card.addEventListener('click', () => {
      card.style.transform = 'scale(0.97)';
      setTimeout(() => card.style.transform = '', 150);
    });
  });
  // 完成状态切换
  document.querySelectorAll('.card-status:not(.status-done)').forEach(s => {
    s.addEventListener('click', e => {
      e.stopPropagation();
      s.classList.toggle('status-done');
    });
  });
</script>
</body>
</html>
