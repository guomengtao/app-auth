<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理员登录 - 激活码系统</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: rgba(255,255,255,0.97);
      border-radius: 24px;
      padding: 48px 40px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 30px 80px rgba(0,0,0,0.5);
      animation: slideUp 0.5s ease-out;
      text-align: center;
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .icon { font-size: 48px; margin-bottom: 16px; }
    h1 { font-size: 1.6rem; color: #1a1a2e; margin-bottom: 6px; }
    .subtitle { font-size: 0.85rem; color: #888; margin-bottom: 32px; }
    .status-text {
      font-size: 0.85rem;
      color: #6c63ff;
      margin-bottom: 16px;
      padding: 10px;
      background: #f0eeff;
      border-radius: 8px;
    }
    .btn-login {
      width: 100%;
      padding: 16px;
      background: #000;
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .btn-login:hover { opacity: 0.85; }
    .btn-login:active { transform: scale(0.98); }
    .btn-login:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-login svg { width: 20px; height: 20px; }
    .hint {
      margin-top: 24px;
      font-size: 0.75rem;
      color: #aaa;
      line-height: 1.6;
    }
    .back-link {
      display: block;
      text-align: center;
      margin-top: 16px;
      font-size: 0.8rem;
      color: #6c63ff;
      text-decoration: none;
    }
    .back-link:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🛡️</div>
    <h1>管理员登录</h1>
    <p class="subtitle" id="subtitle">仅限管理员登录</p>
    <div class="status-text" id="authStatus">正在验证身份...</div>

    <a href="/api/oauth/login" class="btn-login" id="loginBtn" style="text-decoration:none;">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L2 19.5h20L12 2z"/></svg>
      Sign in with Vercel
    </a>
    <p class="hint" id="loginError" style="display:none;color:#e53e3e;"></p>

    <a href="/" class="back-link">← 返回首页</a>
  </div>

  <script>
    function getParam(name) {
      try {
        var search = window.location.search;
        var params = new URLSearchParams(search);
        return params.get(name);
      } catch (e) { return null; }
    }

    function isLogout() {
      return getParam('logout') !== null;
    }

    var errorMessages = {
      'access_denied': 'Vercel 授权被拒绝',
      'no_code': '缺少授权码',
      'oauth_not_configured': 'OAuth 未配置，请联系管理员',
      'token_exchange_failed': 'Token 交换失败',
      'user_fetch_failed': '获取用户信息失败',
      'not_admin': '非管理员账户，无权限访问',
      'oauth_error': 'OAuth 认证过程出错'
    };

    async function checkAuth() {
      document.getElementById('authStatus').textContent = '正在验证身份...';

      try {
        var res = await fetch('/api/admin/me');
        if (res.ok) {
          var data = await res.json();
          if (data.success) {
            document.getElementById('authStatus').textContent = '已通过 Vercel 认证 (' + (data.email || '') + ')，自动跳转中...';
            document.getElementById('loginBtn').style.pointerEvents = 'none';
            document.getElementById('loginBtn').style.opacity = '0.5';
            setTimeout(function() {
              window.location.href = '/admin_Dx23.html';
            }, 500);
            return;
          }
        }
      } catch (e) {}

      document.getElementById('authStatus').textContent = '请通过 Vercel 账户认证登录';
    }

    if (isLogout()) {
      document.getElementById('subtitle').textContent = '已退出登录';
      document.getElementById('authStatus').textContent = '已退出登录，请重新认证';
    }

    var errorCode = getParam('error');
    if (errorCode) {
      var msg = errorMessages[errorCode] || ('认证错误: ' + errorCode);
      document.getElementById('authStatus').textContent = msg;
      document.getElementById('authStatus').style.color = '#e53e3e';
      document.getElementById('authStatus').style.background = '#fff0f0';
      document.getElementById('loginError').textContent = msg;
      document.getElementById('loginError').style.display = 'block';
    }

    checkAuth();
  </script>
</body>
</html>
