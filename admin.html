<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理后台 - 激活码系统</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
    }
    .header {
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      color: #fff;
      padding: 16px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }
    .header h1 { font-size: 1.2rem; font-weight: 600; }
    .header .user { font-size: 0.85rem; opacity: 0.8; }
    .header .logout {
      padding: 6px 16px;
      background: rgba(255,255,255,0.15);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.8rem;
    }
    .header .logout:hover { background: rgba(255,255,255,0.25); }

    .desc-banner {
      background: #fff;
      margin: 16px 32px 0;
      padding: 16px 20px;
      border-radius: 14px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
      font-size: 0.8rem;
      color: #666;
      line-height: 1.7;
      border-left: 4px solid #6c63ff;
    }
    .desc-banner strong { color: #6c63ff; }

    .stats-bar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 14px;
      padding: 20px 32px;
    }
    .stat-card {
      background: #fff;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
      text-align: center;
    }
    .stat-card .number {
      font-size: 2rem;
      font-weight: 700;
      background: linear-gradient(135deg, #6c63ff, #e94560);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .stat-card .label {
      font-size: 0.72rem;
      color: #888;
      margin-top: 4px;
    }

    .tabs {
      display: flex;
      padding: 0 32px;
      border-bottom: 2px solid #e8e8e8;
      background: #fff;
    }
    .tab {
      padding: 12px 24px;
      font-size: 0.85rem;
      font-weight: 600;
      color: #888;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      margin-bottom: -2px;
      transition: all 0.2s;
      background: none;
      border-top: none;
      border-left: none;
      border-right: none;
    }
    .tab:hover { color: #6c63ff; }
    .tab.active { color: #6c63ff; border-bottom-color: #6c63ff; }

    .content { padding: 24px 32px; max-width: 1200px; }
    .panel { display: none; }
    .panel.active { display: block; }

    .toolbar {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
      align-items: center;
    }
    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn-primary {
      background: linear-gradient(135deg, #6c63ff, #e94560);
      color: #fff;
    }
    .btn-outline {
      background: #fff;
      color: #6c63ff;
      border: 2px solid #6c63ff;
    }
    .btn:hover { opacity: 0.88; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    }
    th, td {
      padding: 12px 16px;
      text-align: left;
      font-size: 0.85rem;
    }
    th {
      background: #f8f9fa;
      font-weight: 600;
      color: #555;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    tr:not(:last-child) td { border-bottom: 1px solid #f0f0f0; }
    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 0.7rem;
      font-weight: 600;
    }
    .badge-success { background: #e8f5e9; color: #2e7d32; }
    .badge-warning { background: #fff3e0; color: #e65100; }
    .badge-info { background: #e3f2fd; color: #1565c0; }
    .mono { font-family: 'SF Mono', 'Fira Code', 'Menlo', monospace; font-size: 0.82rem; letter-spacing: 1px; }
    .empty { text-align: center; padding: 40px; color: #aaa; }

    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.show { display: flex; }
    .modal {
      background: #fff;
      border-radius: 20px;
      padding: 32px;
      max-width: 480px;
      width: 90%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    .modal h3 { margin-bottom: 20px; color: #1a1a2e; }
    .modal .field { margin-bottom: 16px; }
    .modal .field label {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      color: #555;
      margin-bottom: 4px;
    }
    .modal .field input, .modal .field select {
      width: 100%;
      padding: 10px 14px;
      border: 2px solid #e8e8e8;
      border-radius: 10px;
      font-size: 0.9rem;
      outline: none;
    }
    .modal .field input:focus, .modal .field select:focus { border-color: #6c63ff; }
    .modal .actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 24px;
    }

    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      padding: 12px 24px;
      border-radius: 10px;
      color: #fff;
      font-size: 0.85rem;
      font-weight: 600;
      z-index: 200;
      animation: slideIn 0.3s ease;
      display: none;
    }
    .toast.show { display: block; }
    .toast.success { background: #2e7d32; }
    .toast.error { background: #c62828; }
    @keyframes slideIn {
      from { opacity: 0; transform: translateX(20px); }
      to { opacity: 1; transform: translateX(0); }
    }

    .decrypt-box {
      background: #fff;
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
      max-width: 640px;
    }
    .decrypt-box h3 {
      font-size: 1.1rem;
      color: #1a1a2e;
      margin-bottom: 6px;
    }
    .decrypt-desc {
      font-size: 0.78rem;
      color: #888;
      margin-bottom: 20px;
    }
    .decrypt-input-row {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    .decrypt-input {
      flex: 1;
      padding: 12px 16px;
      border: 2px solid #e8e8e8;
      border-radius: 10px;
      font-size: 1.1rem;
      font-family: 'SF Mono', 'Fira Code', 'Menlo', monospace;
      letter-spacing: 3px;
      text-align: center;
      outline: none;
      transition: border-color 0.2s;
    }
    .decrypt-input:focus { border-color: #6c63ff; }
    .decrypt-result {
      border-radius: 12px;
      padding: 20px;
      animation: fadeIn 0.3s ease;
    }
    .decrypt-result.success {
      background: #e8f5e9;
      border: 1px solid #a5d6a7;
    }
    .decrypt-result.error {
      background: #ffebee;
      border: 1px solid #ef9a9a;
    }
    .decrypt-result .field-row {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      font-size: 0.85rem;
      border-bottom: 1px solid rgba(0,0,0,0.06);
    }
    .decrypt-result .field-row:last-child { border-bottom: none; }
    .decrypt-result .field-label { color: #666; font-weight: 600; }
    .decrypt-result .field-value { color: #1a1a2e; font-family: 'SF Mono', 'Fira Code', monospace; }
    .decrypt-result .error-msg { color: #c62828; font-weight: 600; }
  </style>
</head>
<body>
  <div class="header">
    <div>
      <h1>激活码管理系统</h1>
      <span class="user" id="usernameDisplay"></span>
    </div>
    <div style="display:flex;gap:8px;align-items:center">
      <a href="/" style="color:#fff;font-size:0.8rem;text-decoration:none;opacity:0.7">← 首页</a>
      <button class="logout" onclick="logout()">退出登录</button>
    </div>
  </div>

  <div class="desc-banner">
    <strong>系统说明：</strong>本系统为小米手环/手表应用提供激活码管理服务。后台生成<strong>4位字母+数字混合兑换码</strong>发放给用户，用户激活后系统基于设备ID后四位生成<strong>16位激活码</strong>（产品ID 4位数字 + 设备ID后四位 4位 + 天数 4位数字 + 校验码 4位数字），兼容手环端解密验证。
  </div>

  <div class="stats-bar">
    <div class="stat-card">
      <div class="number" id="statProducts">-</div>
      <div class="label">产品数量</div>
    </div>
    <div class="stat-card">
      <div class="number" id="statCodes">-</div>
      <div class="label">兑换码总数</div>
    </div>
    <div class="stat-card">
      <div class="number" id="statUsed">-</div>
      <div class="label">已使用</div>
    </div>
    <div class="stat-card">
      <div class="number" id="statActivations">-</div>
      <div class="label">激活次数</div>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('products')">产品管理</button>
    <button class="tab" onclick="switchTab('codes')">兑换码管理</button>
    <button class="tab" onclick="switchTab('records')">激活记录</button>
    <button class="tab" onclick="switchTab('decrypt')">解密验证</button>
  </div>

  <div class="content">
    <div class="panel active" id="panel-products">
      <div class="toolbar">
        <button class="btn btn-primary" onclick="openProductModal()">+ 添加产品</button>
      </div>
      <div id="productsTable"></div>
    </div>

    <div class="panel" id="panel-codes">
      <div class="toolbar">
        <button class="btn btn-primary" onclick="openCodeModal()">+ 生成兑换码</button>
        <select id="filterProduct" onchange="loadCodes()" style="padding:8px 12px;border:2px solid #e8e8e8;border-radius:8px;">
          <option value="">全部产品</option>
        </select>
        <select id="filterUsed" onchange="loadCodes()" style="padding:8px 12px;border:2px solid #e8e8e8;border-radius:8px;">
          <option value="">全部状态</option>
          <option value="false">未使用</option>
          <option value="true">已使用</option>
        </select>
        <select id="filterDuration" onchange="loadCodes()" style="padding:8px 12px;border:2px solid #e8e8e8;border-radius:8px;">
          <option value="">全部有效期</option>
          <option value="30">30 天</option>
          <option value="90">90 天</option>
          <option value="180">180 天</option>
          <option value="365">365 天</option>
          <option value="9999">永久</option>
        </select>
        <button class="btn btn-outline" onclick="loadCodes()">刷新</button>
        <button class="btn btn-outline" onclick="exportCodes()" style="margin-left:auto">导出 CSV</button>
      </div>
      <div id="codesTable"></div>
    </div>

    <div class="panel" id="panel-records">
      <div class="toolbar">
        <select id="filterRecordProduct" onchange="loadRecords()" style="padding:8px 12px;border:2px solid #e8e8e8;border-radius:8px;">
          <option value="">全部产品</option>
        </select>
        <button class="btn btn-outline" onclick="loadRecords()">刷新</button>
      </div>
      <div id="recordsTable"></div>
    </div>

    <div class="panel" id="panel-decrypt">
      <div class="decrypt-box">
        <h3>激活码解密</h3>
        <p class="decrypt-desc">通过算法解密激活码，提取产品ID、设备ID后四位、天数等信息（不查询数据库）</p>
        <div class="decrypt-input-row">
          <input type="text" id="decryptInput" class="decrypt-input" placeholder="输入16位激活码" maxlength="19" autocomplete="off">
          <button class="btn btn-primary" onclick="doDecrypt()">解密</button>
        </div>
        <div class="decrypt-result" id="decryptResult" style="display:none"></div>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="productModal">
    <div class="modal">
      <h3>添加产品</h3>
      <div class="field">
        <label>产品名称</label>
        <input type="text" id="productName" placeholder="例如：VIP Pro">
      </div>
      <div class="field">
        <label>描述</label>
        <input type="text" id="productDesc" placeholder="可选描述">
      </div>
      <div class="actions">
        <button class="btn btn-outline" onclick="closeProductModal()">取消</button>
        <button class="btn btn-primary" onclick="addProduct()">创建</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="codeModal">
    <div class="modal">
      <h3>生成兑换码（4位字母+数字）</h3>
      <div class="field">
        <label>选择产品</label>
        <select id="codeProduct"></select>
      </div>
      <div class="field">
        <label>有效期（天）</label>
        <input type="number" id="codeDuration" value="365" min="1" max="9999">
      </div>
      <div class="field">
        <label>生成数量</label>
        <input type="number" id="codeCount" value="10" min="1" max="1000">
      </div>
      <div class="actions">
        <button class="btn btn-outline" onclick="closeCodeModal()">取消</button>
        <button class="btn btn-primary" onclick="generateCodes()">生成</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    var currentTab = 'products';

    async function api(path, opts) {
      var res = await fetch(path, opts);
      if (res.status === 401) {
        window.location.href = '/login.html';
        throw new Error('Unauthorized');
      }
      if (res.status === 403) {
        var data = await res.json();
        alert(data.error || 'only guomengtao@gmail.com allowed');
        window.location.href = '/login.html';
        throw new Error('Forbidden');
      }
      return res.json();
    }

    function showToast(msg, type) {
      var el = document.getElementById('toast');
      el.textContent = msg;
      el.className = 'toast show ' + type;
      setTimeout(function() { el.className = 'toast'; }, 2500);
    }

    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
      document.querySelectorAll('.panel').forEach(function(p) { p.classList.remove('active'); });
      event.target.classList.add('active');
      document.getElementById('panel-' + tab).classList.add('active');

      if (tab === 'products') loadProducts();
      if (tab === 'codes') loadCodes();
      if (tab === 'records') loadRecords();
      if (tab === 'decrypt') { /* no auto-load needed */ }
    }

    function logout() {
      document.cookie = 'token=; Path=/; Max-Age=0';
      window.location.href = '/login.html';
    }

    async function loadStats() {
      try {
        var data = await api('/api/admin/stats');
        if (data.success) {
          document.getElementById('statProducts').textContent = data.stats.totalProducts;
          document.getElementById('statCodes').textContent = data.stats.totalRedeemCodes;
          document.getElementById('statUsed').textContent = data.stats.usedRedeemCodes;
          document.getElementById('statActivations').textContent = data.stats.totalActivations;
        }
      } catch (e) {}
    }

    async function loadProducts() {
      try {
        var data = await api('/api/admin/products');
        if (!data.success) return;

        var html = '<table><thead><tr><th>ID</th><th>名称</th><th>描述</th><th>创建时间</th></tr></thead><tbody>';
        if (data.products.length === 0) {
          html += '<tr><td colspan="4" class="empty">暂无产品</td></tr>';
        } else {
          data.products.forEach(function(p) {
            html += '<tr>';
            html += '<td class="mono" style="letter-spacing:0">' + p.id + '</td>';
            html += '<td><strong>' + escapeHtml(p.name) + '</strong></td>';
            html += '<td>' + escapeHtml(p.description || '-') + '</td>';
            html += '<td>' + new Date(p.created_at).toLocaleDateString('zh-CN') + '</td>';
            html += '</tr>';
          });
        }
        html += '</tbody></table>';
        document.getElementById('productsTable').innerHTML = html;

        var productSelects = ['filterProduct', 'filterRecordProduct', 'codeProduct'];
        productSelects.forEach(function(sid) {
          var sel = document.getElementById(sid);
          var val = sel.value;
          sel.innerHTML = '<option value="">全部产品</option>';
          data.products.forEach(function(p) {
            sel.innerHTML += '<option value="' + p.id + '">' + escapeHtml(p.name) + '</option>';
          });
          if (sid === 'codeProduct' || sid === 'filterProduct' || sid === 'filterRecordProduct') {
            sel.innerHTML += '<option value="0000">全部产品 (0000)</option>';
          }
          sel.value = val;
        });
      } catch (e) {}
    }

    async function loadCodes() {
      try {
        var params = new URLSearchParams();
        var pid = document.getElementById('filterProduct').value;
        var used = document.getElementById('filterUsed').value;
        var dur = document.getElementById('filterDuration').value;
        if (pid) params.set('product_id', pid);
        if (used) params.set('used', used);
        if (dur) params.set('duration_days', dur);

        var data = await api('/api/admin/redeem-codes?' + params.toString());
        if (!data.success) return;

        var html = '<table><thead><tr><th>兑换码</th><th>产品</th><th>有效期</th><th>状态</th><th>创建时间</th><th>使用时间</th></tr></thead><tbody>';
        if (data.codes.length === 0) {
          html += '<tr><td colspan="6" class="empty">暂无兑换码</td></tr>';
        } else {
          data.codes.forEach(function(c) {
            html += '<tr>';
            html += '<td class="mono">' + c.code + '</td>';
            html += '<td>' + c.product_id + '</td>';
            html += '<td>' + (c.duration_days === 9999 ? '永久' : c.duration_days + ' 天') + '</td>';
            html += '<td><span class="badge ' + (c.used ? 'badge-success' : 'badge-warning') + '">' + (c.used ? '已使用' : '未使用') + '</span></td>';
            html += '<td>' + new Date(c.created_at).toLocaleDateString('zh-CN') + '</td>';
            html += '<td>' + (c.used_at ? new Date(c.used_at).toLocaleString('zh-CN') : '-') + '</td>';
            html += '</tr>';
          });
        }
        html += '</tbody></table>';
        document.getElementById('codesTable').innerHTML = html;
      } catch (e) {}
    }

    async function exportCodes() {
      try {
        var params = new URLSearchParams();
        var pid = document.getElementById('filterProduct').value;
        var used = document.getElementById('filterUsed').value;
        var dur = document.getElementById('filterDuration').value;
        if (pid) params.set('product_id', pid);
        if (used) params.set('used', used);
        if (dur) params.set('duration_days', dur);
        params.set('export', '1');

        showToast('正在导出...', 'success');

        var data = await api('/api/admin/redeem-codes?' + params.toString());
        if (!data.success || !data.codes || data.codes.length === 0) {
          showToast('没有可导出的兑换码', 'error');
          return;
        }

        var csv = 'code,product_id,duration_days,status,created_at,used_at\n';
        data.codes.forEach(function(c) {
          var status = c.used ? 'used' : 'unused';
          var createdAt = new Date(c.created_at).toISOString();
          var usedAt = c.used_at ? new Date(c.used_at).toISOString() : '';
          csv += c.code + ',' + c.product_id + ',' + c.duration_days + ',' + status + ',' + createdAt + ',' + usedAt + '\n';
        });

        var bom = '\uFEFF';
        var blob = new Blob([bom + csv], { type: 'text/csv;charset=utf-8;' });
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = 'redeem-codes-' + new Date().toISOString().slice(0, 10) + '.csv';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);

        showToast('成功导出 ' + data.total + ' 个兑换码', 'success');
      } catch (e) {
        showToast('导出失败', 'error');
      }
    }

    async function loadRecords() {
      try {
        var params = new URLSearchParams();
        var pid = document.getElementById('filterRecordProduct').value;
        if (pid) params.set('product_id', pid);

        var data = await api('/api/admin/records?' + params.toString());
        if (!data.success) return;

        var html = '<table><thead><tr><th>激活码</th><th>设备哈希</th><th>产品</th><th>有效期</th><th>生成时间</th><th>到期时间</th></tr></thead><tbody>';
        if (data.records.length === 0) {
          html += '<tr><td colspan="6" class="empty">暂无激活记录</td></tr>';
        } else {
          data.records.forEach(function(r) {
            html += '<tr>';
            html += '<td class="mono" style="font-size:0.75rem">' + r.activation_code + '</td>';
            html += '<td class="mono" style="font-size:0.7rem;letter-spacing:0">' + r.device_id_hash + '</td>';
            html += '<td>' + r.product_id + '</td>';
            html += '<td>' + (r.duration_days === 9999 ? '永久' : r.duration_days + ' 天') + '</td>';
            html += '<td>' + new Date(r.generated_at).toLocaleString('zh-CN') + '</td>';
            html += '<td>' + (r.expires_at ? new Date(r.expires_at).toLocaleDateString('zh-CN') : '<span class="badge badge-info">永不过期</span>') + '</td>';
            html += '</tr>';
          });
        }
        html += '</tbody></table>';
        document.getElementById('recordsTable').innerHTML = html;
      } catch (e) {}
    }

    function openProductModal() {
      document.getElementById('productModal').classList.add('show');
    }

    function closeProductModal() {
      document.getElementById('productModal').classList.remove('show');
      document.getElementById('productName').value = '';
      document.getElementById('productDesc').value = '';
    }

    async function addProduct() {
      var name = document.getElementById('productName').value.trim();
      var desc = document.getElementById('productDesc').value.trim();

      if (!name) { showToast('请输入产品名称', 'error'); return; }

      try {
        var data = await api('/api/admin/products', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: name, description: desc }),
        });
        if (data.success) {
          showToast('产品创建成功', 'success');
          closeProductModal();
          loadProducts();
          loadStats();
        } else {
          showToast(data.error, 'error');
        }
      } catch (e) {}
    }

    function openCodeModal() {
      document.getElementById('codeModal').classList.add('show');
    }

    function closeCodeModal() {
      document.getElementById('codeModal').classList.remove('show');
      document.getElementById('codeDuration').value = '365';
      document.getElementById('codeCount').value = '10';
    }

    async function generateCodes() {
      var productId = document.getElementById('codeProduct').value;
      var duration = parseInt(document.getElementById('codeDuration').value);
      var count = parseInt(document.getElementById('codeCount').value);

      if (!productId) { showToast('请选择产品', 'error'); return; }

      try {
        var data = await api('/api/admin/redeem-codes', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ product_id: productId, duration_days: duration, count: count }),
        });
        if (data.success) {
          showToast('成功生成 ' + count + ' 个兑换码', 'success');
          closeCodeModal();
          loadCodes();
          loadStats();
        } else {
          showToast(data.error, 'error');
        }
      } catch (e) {}
    }

    function escapeHtml(str) {
      var div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function pad4(n) {
      var s = String(n);
      while (s.length < 4) { s = "0" + s; }
      return s;
    }

    function generateChecksum4(str) {
      var hash = 0;
      for (var i = 0; i < str.length; i++) {
        hash = ((hash << 5) - hash) + str.charCodeAt(i);
        hash = hash & hash;
      }
      return pad4(Math.abs(hash) % 10000);
    }

    var ACTIVATION_SECRET = "7319";

    function scramble4(digits, secret) {
      var result = "";
      for (var i = 0; i < 4; i++) {
        result += ((parseInt(digits[i], 10) + parseInt(secret[i], 10)) % 10).toString();
      }
      return result;
    }

    function unscramble4(digits, secret) {
      var result = "";
      for (var i = 0; i < 4; i++) {
        result += ((parseInt(digits[i], 10) - parseInt(secret[i], 10) + 10) % 10).toString();
      }
      return result;
    }

    function decryptCode(code) {
      var cleaned = code.replace(/\s/g, "");
      if (cleaned.length !== 16) {
        return { valid: false, reason: "激活码长度无效（需16位）" };
      }

      var scrambledPid = cleaned.substring(0, 4);
      var idHash = cleaned.substring(4, 8);
      var scrambledDays = cleaned.substring(8, 12);
      var checksum = cleaned.substring(12, 16);
      var plain = scrambledPid + idHash + scrambledDays;
      var expectedChecksum = generateChecksum4(plain);
      if (checksum !== expectedChecksum) {
        return { valid: false, reason: "校验码不匹配，激活码可能被篡改" };
      }
      var pid = unscramble4(scrambledPid, ACTIVATION_SECRET);
      var days = parseInt(unscramble4(scrambledDays, ACTIVATION_SECRET), 10);
      return {
        valid: true,
        productId: pid,
        deviceHash: idHash,
        days: days,
        isPermanent: days === 9999,
        format: "16位",
      };
    }

    function doDecrypt() {
      var input = document.getElementById('decryptInput').value.trim();
      var resultEl = document.getElementById('decryptResult');

      if (!input) {
        resultEl.style.display = 'block';
        resultEl.className = 'decrypt-result error';
        resultEl.innerHTML = '<span class="error-msg">请输入激活码</span>';
        return;
      }

      var result = decryptCode(input);

      if (!result.valid) {
        resultEl.style.display = 'block';
        resultEl.className = 'decrypt-result error';
        resultEl.innerHTML = '<span class="error-msg">' + result.reason + '</span>';
        return;
      }

      var html = '';
      html += '<div class="field-row"><span class="field-label">格式版本</span><span class="field-value">' + result.format + '</span></div>';
      html += '<div class="field-row"><span class="field-label">产品ID</span><span class="field-value">' + result.productId + '</span></div>';
      html += '<div class="field-row"><span class="field-label">设备ID后四位</span><span class="field-value">' + result.deviceHash + '</span></div>';
      html += '<div class="field-row"><span class="field-label">授权天数</span><span class="field-value">' + (result.isPermanent ? '永久 (9999天)' : result.days + ' 天') + '</span></div>';
      html += '<div class="field-row"><span class="field-label">校验状态</span><span class="field-value" style="color:#2e7d32">✓ 校验通过</span></div>';

      resultEl.style.display = 'block';
      resultEl.className = 'decrypt-result success';
      resultEl.innerHTML = html;
    }

    document.getElementById('decryptInput').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') doDecrypt();
    });

    loadStats();
    loadProducts();
    setInterval(loadStats, 30000);
  </script>
</body>
</html>
