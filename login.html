<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: rgba(255,255,255,0.97);
      border-radius: 24px;
      padding: 48px 40px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 30px 80px rgba(0,0,0,0.5);
      animation: slideUp 0.5s ease-out;
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .icon { text-align: center; font-size: 48px; margin-bottom: 16px; }
    h1 { text-align: center; font-size: 1.6rem; color: #1a1a2e; margin-bottom: 6px; }
    .subtitle { text-align: center; font-size: 0.85rem; color: #888; margin-bottom: 32px; }
    .field { margin-bottom: 20px; }
    .field label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: #555;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .field input {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid #e8e8e8;
      border-radius: 12px;
      font-size: 1rem;
      transition: border-color 0.2s;
      outline: none;
    }
    .field input:focus { border-color: #6c63ff; }
    .btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #6c63ff, #e94560);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      margin-top: 8px;
    }
    .btn:hover { opacity: 0.92; }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .error {
      margin-top: 16px;
      padding: 12px;
      background: #ffebee;
      color: #c62828;
      border-radius: 10px;
      text-align: center;
      font-size: 0.85rem;
      display: none;
    }
    .error.show { display: block; }
    .hint {
      text-align: center;
      margin-top: 20px;
      font-size: 0.75rem;
      color: #aaa;
    }
    .loading {
      display: inline-block;
      width: 16px; height: 16px;
      border: 2px solid #fff;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🛡️</div>
    <h1>Admin Login</h1>
    <p class="subtitle">Sign in to manage activation codes</p>

    <div class="field">
      <label>Username</label>
      <input type="text" id="username" placeholder="admin" autocomplete="username">
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="password" placeholder="Enter password" autocomplete="current-password">
    </div>
    <button class="btn" id="loginBtn" onclick="login()">Sign In</button>

    <div class="error" id="error"></div>
    <p class="hint">Default: admin / admin123</p>
  </div>

  <script>
    function setLoading(loading) {
      var btn = document.getElementById('loginBtn');
      if (loading) {
        btn.disabled = true;
        btn.innerHTML = '<span class="loading"></span>Signing in...';
      } else {
        btn.disabled = false;
        btn.innerHTML = 'Sign In';
      }
    }

    function showError(msg) {
      var el = document.getElementById('error');
      el.textContent = msg;
      el.className = 'error show';
    }

    async function login() {
      var username = document.getElementById('username').value.trim();
      var password = document.getElementById('password').value;

      if (!username || !password) {
        showError('Please enter username and password');
        return;
      }

      setLoading(true);
      document.getElementById('error').className = 'error';

      try {
        var res = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
        });
        var data = await res.json();

        if (data.success) {
          window.location.href = '/admin.html';
        } else {
          showError(data.error || 'Login failed');
        }
      } catch (e) {
        showError('Network error. Please try again.');
      }

      setLoading(false);
    }

    document.getElementById('password').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') login();
    });
  </script>
</body>
</html>
