<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理员登录</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: rgba(255,255,255,0.97);
      border-radius: 24px;
      padding: 48px 40px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 30px 80px rgba(0,0,0,0.5);
      animation: slideUp 0.5s ease-out;
      text-align: center;
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .icon { font-size: 48px; margin-bottom: 16px; }
    h1 { font-size: 1.6rem; color: #1a1a2e; margin-bottom: 6px; }
    .subtitle { font-size: 0.85rem; color: #888; margin-bottom: 32px; }
    .btn-vercel {
      width: 100%;
      padding: 16px;
      background: #000;
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .btn-vercel:hover { opacity: 0.85; }
    .btn-vercel:active { transform: scale(0.98); }
    .btn-vercel svg { width: 20px; height: 20px; }
    .hint {
      margin-top: 24px;
      font-size: 0.75rem;
      color: #aaa;
      line-height: 1.6;
    }
    .back-link {
      display: block;
      text-align: center;
      margin-top: 16px;
      font-size: 0.8rem;
      color: #6c63ff;
      text-decoration: none;
    }
    .back-link:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🛡️</div>
    <h1>管理员登录</h1>
    <p class="subtitle">仅限管理员通过 Vercel 认证登录</p>

    <button class="btn-vercel" onclick="location.href='/admin.html'">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.477 2 2 6.477 2 12s4.477 10 10 10 10-4.477 10-10S17.523 2 12 2zm0 18.5L4.5 12 12 4.5 19.5 12 12 20.5z"/></svg>
      Vercel 认证登录
    </button>

    <p class="hint">
      仅允许 <strong>guomengtao@gmail.com</strong> 登录<br>
      需在 Vercel 后台 → Settings → Deployment Protection<br>
      开启 <strong>Vercel Authentication</strong>
    </p>
    <a href="/" class="back-link">← 返回首页</a>
  </div>
</body>
</html>
