<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - App Auth</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
    }
    .header {
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      color: #fff;
      padding: 16px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }
    .header h1 { font-size: 1.2rem; font-weight: 600; }
    .header .user { font-size: 0.85rem; opacity: 0.8; }
    .header .logout {
      padding: 6px 16px;
      background: rgba(255,255,255,0.15);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.8rem;
    }
    .header .logout:hover { background: rgba(255,255,255,0.25); }

    .stats-bar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 16px;
      padding: 24px 32px;
    }
    .stat-card {
      background: #fff;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
      text-align: center;
    }
    .stat-card .number {
      font-size: 2rem;
      font-weight: 700;
      background: linear-gradient(135deg, #6c63ff, #e94560);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .stat-card .label {
      font-size: 0.75rem;
      color: #888;
      margin-top: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .tabs {
      display: flex;
      gap: 0;
      padding: 0 32px;
      border-bottom: 2px solid #e8e8e8;
      background: #fff;
    }
    .tab {
      padding: 12px 24px;
      font-size: 0.85rem;
      font-weight: 600;
      color: #888;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      margin-bottom: -2px;
      transition: all 0.2s;
      background: none;
      border-top: none;
      border-left: none;
      border-right: none;
    }
    .tab:hover { color: #6c63ff; }
    .tab.active { color: #6c63ff; border-bottom-color: #6c63ff; }

    .content {
      padding: 24px 32px;
      max-width: 1200px;
    }
    .panel { display: none; }
    .panel.active { display: block; }

    .toolbar {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
      align-items: center;
    }
    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn-primary {
      background: linear-gradient(135deg, #6c63ff, #e94560);
      color: #fff;
    }
    .btn-outline {
      background: #fff;
      color: #6c63ff;
      border: 2px solid #6c63ff;
    }
    .btn:hover { opacity: 0.88; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    }
    th, td {
      padding: 12px 16px;
      text-align: left;
      font-size: 0.85rem;
    }
    th {
      background: #f8f9fa;
      font-weight: 600;
      color: #555;
      text-transform: uppercase;
      font-size: 0.7rem;
      letter-spacing: 0.5px;
    }
    tr:not(:last-child) td { border-bottom: 1px solid #f0f0f0; }
    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 0.7rem;
      font-weight: 600;
    }
    .badge-success { background: #e8f5e9; color: #2e7d32; }
    .badge-warning { background: #fff3e0; color: #e65100; }
    .badge-info { background: #e3f2fd; color: #1565c0; }
    .mono { font-family: 'SF Mono', 'Fira Code', monospace; font-size: 0.8rem; }
    .empty { text-align: center; padding: 40px; color: #aaa; }

    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.show { display: flex; }
    .modal {
      background: #fff;
      border-radius: 20px;
      padding: 32px;
      max-width: 480px;
      width: 90%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    .modal h3 { margin-bottom: 20px; color: #1a1a2e; }
    .modal .field { margin-bottom: 16px; }
    .modal .field label {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      color: #555;
      margin-bottom: 4px;
      text-transform: uppercase;
    }
    .modal .field input, .modal .field select {
      width: 100%;
      padding: 10px 14px;
      border: 2px solid #e8e8e8;
      border-radius: 10px;
      font-size: 0.9rem;
      outline: none;
    }
    .modal .field input:focus, .modal .field select:focus { border-color: #6c63ff; }
    .modal .actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 24px;
    }

    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      padding: 12px 24px;
      border-radius: 10px;
      color: #fff;
      font-size: 0.85rem;
      font-weight: 600;
      z-index: 200;
      animation: slideIn 0.3s ease;
      display: none;
    }
    .toast.show { display: block; }
    .toast.success { background: #2e7d32; }
    .toast.error { background: #c62828; }
    @keyframes slideIn {
      from { opacity: 0; transform: translateX(20px); }
      to { opacity: 1; transform: translateX(0); }
    }
    .loading-dots {
      text-align: center;
      padding: 20px;
      color: #888;
    }
  </style>
</head>
<body>
  <div class="header">
    <div>
      <h1>App Auth Admin</h1>
      <span class="user" id="usernameDisplay"></span>
    </div>
    <button class="logout" onclick="logout()">Logout</button>
  </div>

  <div class="stats-bar">
    <div class="stat-card">
      <div class="number" id="statProducts">-</div>
      <div class="label">Products</div>
    </div>
    <div class="stat-card">
      <div class="number" id="statCodes">-</div>
      <div class="label">Total Codes</div>
    </div>
    <div class="stat-card">
      <div class="number" id="statUsed">-</div>
      <div class="label">Used</div>
    </div>
    <div class="stat-card">
      <div class="number" id="statActivations">-</div>
      <div class="label">Activations</div>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('products')">Products</button>
    <button class="tab" onclick="switchTab('codes')">Redeem Codes</button>
    <button class="tab" onclick="switchTab('records')">Activation Records</button>
  </div>

  <div class="content">
    <div class="panel active" id="panel-products">
      <div class="toolbar">
        <button class="btn btn-primary" onclick="openProductModal()">+ Add Product</button>
      </div>
      <div id="productsTable"></div>
    </div>

    <div class="panel" id="panel-codes">
      <div class="toolbar">
        <button class="btn btn-primary" onclick="openCodeModal()">+ Generate Codes</button>
        <select id="filterProduct" onchange="loadCodes()" style="padding:8px 12px;border:2px solid #e8e8e8;border-radius:8px;">
          <option value="">All Products</option>
        </select>
        <select id="filterUsed" onchange="loadCodes()" style="padding:8px 12px;border:2px solid #e8e8e8;border-radius:8px;">
          <option value="">All Status</option>
          <option value="false">Unused</option>
          <option value="true">Used</option>
        </select>
        <button class="btn btn-outline" onclick="loadCodes()">Refresh</button>
      </div>
      <div id="codesTable"></div>
    </div>

    <div class="panel" id="panel-records">
      <div class="toolbar">
        <select id="filterRecordProduct" onchange="loadRecords()" style="padding:8px 12px;border:2px solid #e8e8e8;border-radius:8px;">
          <option value="">All Products</option>
        </select>
        <button class="btn btn-outline" onclick="loadRecords()">Refresh</button>
      </div>
      <div id="recordsTable"></div>
    </div>
  </div>

  <div class="modal-overlay" id="productModal">
    <div class="modal">
      <h3>Add Product</h3>
      <div class="field">
        <label>Product Name</label>
        <input type="text" id="productName" placeholder="e.g. VIP Pro">
      </div>
      <div class="field">
        <label>Description</label>
        <input type="text" id="productDesc" placeholder="Optional description">
      </div>
      <div class="actions">
        <button class="btn btn-outline" onclick="closeProductModal()">Cancel</button>
        <button class="btn btn-primary" onclick="addProduct()">Create</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="codeModal">
    <div class="modal">
      <h3>Generate Redeem Codes</h3>
      <div class="field">
        <label>Product</label>
        <select id="codeProduct"></select>
      </div>
      <div class="field">
        <label>Duration (days)</label>
        <input type="number" id="codeDuration" value="365" min="1" max="9999">
      </div>
      <div class="field">
        <label>Count</label>
        <input type="number" id="codeCount" value="10" min="1" max="1000">
      </div>
      <div class="actions">
        <button class="btn btn-outline" onclick="closeCodeModal()">Cancel</button>
        <button class="btn btn-primary" onclick="generateCodes()">Generate</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    var currentTab = 'products';

    async function api(path, opts) {
      var res = await fetch(path, opts);
      if (res.status === 401) {
        window.location.href = '/login.html';
        throw new Error('Unauthorized');
      }
      return res.json();
    }

    function showToast(msg, type) {
      var el = document.getElementById('toast');
      el.textContent = msg;
      el.className = 'toast show ' + type;
      setTimeout(function() { el.className = 'toast'; }, 2500);
    }

    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
      document.querySelectorAll('.panel').forEach(function(p) { p.classList.remove('active'); });
      event.target.classList.add('active');
      document.getElementById('panel-' + tab).classList.add('active');

      if (tab === 'products') loadProducts();
      if (tab === 'codes') loadCodes();
      if (tab === 'records') loadRecords();
    }

    function logout() {
      document.cookie = 'token=; Path=/; Max-Age=0';
      window.location.href = '/login.html';
    }

    async function loadStats() {
      try {
        var data = await api('/api/admin/stats');
        if (data.success) {
          document.getElementById('statProducts').textContent = data.stats.totalProducts;
          document.getElementById('statCodes').textContent = data.stats.totalRedeemCodes;
          document.getElementById('statUsed').textContent = data.stats.usedRedeemCodes;
          document.getElementById('statActivations').textContent = data.stats.totalActivations;
        }
      } catch (e) {}
    }

    async function loadProducts() {
      try {
        var data = await api('/api/admin/products');
        if (!data.success) return;

        var html = '<table><thead><tr><th>ID</th><th>Name</th><th>Description</th><th>Created</th></tr></thead><tbody>';
        if (data.products.length === 0) {
          html += '<tr><td colspan="4" class="empty">No products yet</td></tr>';
        } else {
          data.products.forEach(function(p) {
            html += '<tr>';
            html += '<td class="mono">' + p.id + '</td>';
            html += '<td><strong>' + escapeHtml(p.name) + '</strong></td>';
            html += '<td>' + escapeHtml(p.description || '-') + '</td>';
            html += '<td>' + new Date(p.created_at).toLocaleDateString() + '</td>';
            html += '</tr>';
          });
        }
        html += '</tbody></table>';
        document.getElementById('productsTable').innerHTML = html;

        var productSelects = ['filterProduct', 'filterRecordProduct', 'codeProduct'];
        productSelects.forEach(function(sid) {
          var sel = document.getElementById(sid);
          var val = sel.value;
          sel.innerHTML = '<option value="">All Products</option>';
          data.products.forEach(function(p) {
            sel.innerHTML += '<option value="' + p.id + '">' + escapeHtml(p.name) + '</option>';
          });
          sel.value = val;
        });
      } catch (e) {}
    }

    async function loadCodes() {
      try {
        var params = new URLSearchParams();
        var pid = document.getElementById('filterProduct').value;
        var used = document.getElementById('filterUsed').value;
        if (pid) params.set('product_id', pid);
        if (used) params.set('used', used);

        var data = await api('/api/admin/redeem-codes?' + params.toString());
        if (!data.success) return;

        var html = '<table><thead><tr><th>Code</th><th>Product</th><th>Duration</th><th>Status</th><th>Created</th><th>Used At</th></tr></thead><tbody>';
        if (data.codes.length === 0) {
          html += '<tr><td colspan="6" class="empty">No redeem codes found</td></tr>';
        } else {
          data.codes.forEach(function(c) {
            html += '<tr>';
            html += '<td class="mono">' + c.code + '</td>';
            html += '<td>' + c.product_id + '</td>';
            html += '<td>' + (c.duration_days === 9999 ? 'Lifetime' : c.duration_days + ' days') + '</td>';
            html += '<td><span class="badge ' + (c.used ? 'badge-success' : 'badge-warning') + '">' + (c.used ? 'Used' : 'Unused') + '</span></td>';
            html += '<td>' + new Date(c.created_at).toLocaleDateString() + '</td>';
            html += '<td>' + (c.used_at ? new Date(c.used_at).toLocaleString() : '-') + '</td>';
            html += '</tr>';
          });
        }
        html += '</tbody></table>';
        document.getElementById('codesTable').innerHTML = html;
      } catch (e) {}
    }

    async function loadRecords() {
      try {
        var params = new URLSearchParams();
        var pid = document.getElementById('filterRecordProduct').value;
        if (pid) params.set('product_id', pid);

        var data = await api('/api/admin/records?' + params.toString());
        if (!data.success) return;

        var html = '<table><thead><tr><th>Activation Code</th><th>Device</th><th>Product</th><th>Duration</th><th>Generated</th><th>Expires</th></tr></thead><tbody>';
        if (data.records.length === 0) {
          html += '<tr><td colspan="6" class="empty">No activation records</td></tr>';
        } else {
          data.records.forEach(function(r) {
            html += '<tr>';
            html += '<td class="mono" style="font-size:0.7rem">' + r.activation_code + '</td>';
            html += '<td class="mono" style="font-size:0.7rem">' + r.device_id_hash.slice(0, 16) + '...</td>';
            html += '<td>' + r.product_id + '</td>';
            html += '<td>' + (r.duration_days === 9999 ? 'Lifetime' : r.duration_days + ' days') + '</td>';
            html += '<td>' + new Date(r.generated_at).toLocaleString() + '</td>';
            html += '<td>' + (r.expires_at ? new Date(r.expires_at).toLocaleDateString() : '<span class="badge badge-info">Never</span>') + '</td>';
            html += '</tr>';
          });
        }
        html += '</tbody></table>';
        document.getElementById('recordsTable').innerHTML = html;
      } catch (e) {}
    }

    function openProductModal() {
      document.getElementById('productModal').classList.add('show');
    }

    function closeProductModal() {
      document.getElementById('productModal').classList.remove('show');
      document.getElementById('productName').value = '';
      document.getElementById('productDesc').value = '';
    }

    async function addProduct() {
      var name = document.getElementById('productName').value.trim();
      var desc = document.getElementById('productDesc').value.trim();

      if (!name) { showToast('Product name is required', 'error'); return; }

      try {
        var data = await api('/api/admin/products', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: name, description: desc }),
        });
        if (data.success) {
          showToast('Product created', 'success');
          closeProductModal();
          loadProducts();
          loadStats();
        } else {
          showToast(data.error, 'error');
        }
      } catch (e) {}
    }

    function openCodeModal() {
      document.getElementById('codeModal').classList.add('show');
    }

    function closeCodeModal() {
      document.getElementById('codeModal').classList.remove('show');
      document.getElementById('codeDuration').value = '365';
      document.getElementById('codeCount').value = '10';
    }

    async function generateCodes() {
      var productId = document.getElementById('codeProduct').value;
      var duration = parseInt(document.getElementById('codeDuration').value);
      var count = parseInt(document.getElementById('codeCount').value);

      if (!productId) { showToast('Please select a product', 'error'); return; }

      try {
        var data = await api('/api/admin/redeem-codes', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ product_id: productId, duration_days: duration, count: count }),
        });
        if (data.success) {
          showToast(count + ' codes generated', 'success');
          closeCodeModal();
          loadCodes();
          loadStats();
        } else {
          showToast(data.error, 'error');
        }
      } catch (e) {}
    }

    function escapeHtml(str) {
      var div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    loadStats();
    loadProducts();
    setInterval(loadStats, 30000);
  </script>
</body>
</html>
