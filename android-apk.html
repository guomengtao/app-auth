.device{width:170px;flex:0 0 auto;height:340px;border-radius:22px;background:#0b0b0f;padding:6px;overflow:hidden}

.meta{margin-top:8px;font-size:.76rem;color:var(--muted);border-top:1px dashed var(--line);padding-top:6px}
.footer{text-align:center;color:var(--muted);font-size:.8rem;padding:24px 20px;line-height:1.8}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:50;cursor:zoom-out}
.lightbox.show{display:flex}
.lightbox img{max-width:90vw;max-height:90vh;border-radius:20px}
